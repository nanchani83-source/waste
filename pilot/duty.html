<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F5E5B">
<title>당직 알림</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F4; --card:#fff; --ink:#122220; --soft:#566865; --faint:#8A9A97; --line:#DCE3E1;
  --brand:#0F5E5B; --brand-deep:#0B4745; --brand-soft:#E2F0EE;
  --wait:#B4540A; --wait-soft:#FFF0DF; --ack:#2155C4; --done:#177245; --err:#B3261E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",-apple-system,sans-serif;font-size:18px;-webkit-font-smoothing:antialiased;line-height:1.5}
:focus-visible{outline:3px solid #7FB8B3;outline-offset:2px}

/* 상단: 누구인지 + 처리할 건수가 가장 크게 */
.top{background:var(--brand);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 22px}
.top-in{max-width:520px;margin:0 auto}
.who{font-size:15px;color:#CFE6E3;font-weight:500}
.big{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.big strong{font-size:44px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.big span{font-size:19px;font-weight:700}
.big.zero strong{font-size:28px}

main{max-width:520px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}

/* 요청 카드 */
.req{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 18px 22px;margin-bottom:14px;overflow:hidden}
.req::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
.req.w::before{background:var(--wait)}
.req.a::before{background:var(--ack)}
.req.d::before{background:var(--done)}
.req.w{border-color:#F0C9A0;background:#FFFAF4}
.req-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dept{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.loc{font-size:20px;font-weight:700;margin-top:2px}
.tag{flex:none;font-size:14px;font-weight:800;padding:4px 11px;border-radius:99px;color:#fff}
.tag.w{background:var(--wait)}.tag.a{background:var(--ack)}.tag.d{background:var(--done)}
.meta{margin-top:8px;font-size:16px;color:var(--soft)}
.meta b{color:var(--ink);font-weight:700}
.memo{margin-top:6px;font-size:16px;color:var(--soft)}
.call{display:inline-flex;align-items:center;gap:8px;margin-top:10px;min-height:48px;padding:0 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:800;font-size:18px;text-decoration:none}
.call svg{width:20px;height:20px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.btn{width:100%;min-height:64px;border:0;border-radius:14px;color:#fff;font:inherit;font-weight:800;font-size:22px;margin-top:14px;transition:transform .08s,filter .12s}
.btn:active{transform:scale(.985);filter:brightness(.92)}
.btn:disabled{opacity:.55}
.b-ack{background:var(--ack)}.b-done{background:var(--done)}.b-main{background:var(--brand)}
.b-sub{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-size:17px;min-height:54px;margin-top:6px}

.empty{padding:34px 12px;text-align:center;color:var(--soft);font-size:17px}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:4px}

details.dn{margin:6px 0 14px}
details.dn summary{cursor:pointer;font-weight:800;font-size:16px;color:var(--soft);padding:10px 4px;list-style:none}
details.dn summary::-webkit-details-marker{display:none}
details.dn summary::before{content:"▸ ";}
details.dn[open] summary::before{content:"▾ ";}
.req.d{padding:14px 16px 14px 22px;margin-bottom:8px}
.req.d .dept{font-size:18px}.req.d .loc{font-size:16px}

/* 등록 */
.lab{display:block;font-weight:700;font-size:16px;margin:0 0 6px}
select,input{width:100%;font:inherit;font-size:19px;min-height:56px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-bottom:16px}
select:focus,input:focus{border-color:var(--brand);outline:3px solid #BFE0DC;outline-offset:0}
.hint{background:var(--wait-soft);border:1px solid #F0C9A0;border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.6;margin-bottom:16px}
.err{color:var(--err);font-weight:700;font-size:16px;margin:8px 0}
.ok{color:var(--done);font-weight:700;font-size:16px;margin:8px 0}
h2.reg-t{margin:0 0 4px;font-size:22px;font-weight:800}
p.reg-s{margin:0 0 18px;color:var(--soft);font-size:16px}
a.reset{display:block;text-align:center;color:var(--soft);font-size:15px;margin-top:18px;padding:10px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="who" id="who">당직 알림</div>
  <div class="big" id="big" hidden><strong id="bigN">0</strong><span id="bigT">건 처리 대기</span></div>
</div></header>

<main>
  <!-- 등록 -->
  <section class="card" id="reg" hidden>
    <h2 class="reg-t">이 폰에서 알림 받기</h2>
    <p class="reg-s" style="margin-bottom:6px">한 번만 등록하면 당직일에 청소 요청 알림이 옵니다.</p>
    <p class="reg-s">이름 표기가 동일한 경우 (사번 끝자리)로 구분합니다.</p>
    <div class="hint" id="iosHint" hidden><b>아이폰</b>은 먼저 화면 아래 <b>공유(□↑)</b> 버튼 → <b>'홈 화면에 추가'</b>를 누른 뒤, 홈 화면의 <b>당직알림</b> 아이콘으로 다시 열어 주세요.</div>
    <label class="lab" for="name">이름</label>
    <select id="name"></select>
    <label class="lab" for="pin">등록코드</label>
    <input id="pin" type="password" inputmode="numeric" placeholder="받으신 등록코드 번호" autocomplete="off">
    <button class="btn b-main" id="regBtn">알림 켜기</button>
    <div class="err" id="regErr" role="alert"></div>
  </section>

  <!-- 평소 화면 -->
  <div id="main" hidden>
    <div id="list"></div>
    <button class="btn b-sub" id="testBtn">테스트 알림 받아보기</button>
    <div class="err" id="mainErr" role="alert"></div>
    <a href="#" class="reset" id="reset">이 폰 등록 해제</a>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="config.js"></script>
<script>
const API = PILOT.API_URL;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const focusId = new URLSearchParams(location.search).get("id");
const deviceLabel = () => { const u = navigator.userAgent; return /android/i.test(u) ? "안드로이드" : /iphone|ipad|ipod/i.test(u) ? "아이폰" : "PC"; };
const PHONE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>';

function showReg() {
  $("reg").hidden = false; $("main").hidden = true; $("big").hidden = true;
  $("who").textContent = "당직 알림";
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  $("iosHint").hidden = !(ios && !standalone);
  fetch(API + "?action=people").then((r) => r.json()).then((r) => {
    $("name").innerHTML = '<option value="">이름을 선택하세요</option>' + (r.people || []).slice().sort((a, b) => (b === (r.admin || "관리자")) - (a === (r.admin || "관리자"))).map((p) => `<option value="${esc(p)}">${esc(p)}${(r.registered || []).includes(p) ? " (등록됨)" : ""}</option>`).join("");
  }).catch(() => ($("regErr").textContent = "서버에 연결할 수 없습니다."));
}

$("regBtn").addEventListener("click", async () => {
  $("regErr").textContent = "";
  const name = $("name").value, pin = $("pin").value.trim();
  if (!name || !pin) return ($("regErr").textContent = "이름과 등록코드를 입력하세요.");
  try {
    if (!("serviceWorker" in navigator) || !("Notification" in window)) throw new Error("이 브라우저는 알림을 지원하지 않습니다. (아이폰은 홈 화면에 추가 후 열어 주세요)");
    const perm = await Notification.requestPermission();
    if (perm !== "granted") throw new Error("알림이 허용되지 않았습니다. 설정에서 알림을 허용해 주세요.");
    firebase.initializeApp(PILOT.FIREBASE);
    const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
    await navigator.serviceWorker.ready;
    const token = await firebase.messaging().getToken({ vapidKey: PILOT.VAPID, serviceWorkerRegistration: reg });
    if (!token) throw new Error("알림 토큰을 받지 못했습니다.");
    const r = await (await fetch(API, { method: "POST", body: JSON.stringify({
      action: "register", name, pin, token, deviceId: store.get("deviceId"), label: deviceLabel() }) })).json();
    if (!r.ok) throw new Error(r.error);
    store.set("deviceId", r.deviceId); store.set("key", r.key); store.set("name", name);
    showMain();
  } catch (e) { $("regErr").textContent = e.message || String(e); }
});

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
function showMain() {
  $("reg").hidden = true; $("main").hidden = false;
  $("who").textContent = store.get("name") + "님";
  load();
  initForeground();
}

// 화면이 켜져 있을 때 오는 알림은 FCM이 자동으로 띄우지 않으므로 직접 알림창을 보여준다
let fgReady = false;
async function initForeground() {
  if (fgReady) return;
  try {
    if (!("serviceWorker" in navigator) || !("Notification" in window) || Notification.permission !== "granted") return;
    if (!firebase.apps.length) firebase.initializeApp(PILOT.FIREBASE);
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) return;
    firebase.messaging().onMessage((p) => {
      const n = p.notification || {};
      reg.showNotification(n.title || "청소 요청", {
        body: n.body || "", tag: (p.data && p.data.tag) || "fg", icon: "icon.svg",
        renotify: true, requireInteraction: true, vibrate: [300, 150, 300, 150, 300]
      });
      load();
    });
    fgReady = true;
  } catch (e) {}
}

function card(it) {
  const waiting = it.st === "접수";
  if (!waiting) {
    return `<div class="req d" id="r${esc(it.id)}"><div class="req-head"><div><div class="dept">${esc(it.ward)} ${esc(it.loc)}</div>
      <div class="meta">${esc(it.kind)} · ${esc(it.at)} 접수${it.ackAt ? " · " + esc(it.ackAt) + " 확인" : ""}${it.by ? " · " + esc(it.by) : ""}</div></div><span class="tag d">확인</span></div></div>`;
  }
  const cls = "w";
  return `<div class="req ${cls}" id="r${esc(it.id)}">
    <div class="req-head"><div><div class="dept">${esc(it.ward)}</div><div class="loc">${esc(it.loc)}</div></div><span class="tag ${cls}">대기</span></div>
    <div class="meta"><b>${esc(it.kind)}</b> · ${esc(it.at)} 접수</div>
    ${it.memo ? `<div class="memo">메모: ${esc(it.memo)}</div>` : ""}
    ${it.ext ? `<a class="call" href="tel:033258${esc(String(it.ext).replace(/\D/g, ""))}">${PHONE}회신 내선 ${esc(it.ext)}</a>` : ""}
    <button class="btn b-ack" data-a="ack" data-id="${esc(it.id)}">확인했습니다</button>
  </div>`;
}

async function load() {
  try {
    const r = await (await fetch(API + "?action=duty&deviceId=" + encodeURIComponent(store.get("deviceId")) +
      "&key=" + encodeURIComponent(store.get("key")))).json();
    if (!r.ok) { if (r.error === "auth") { store.del("key"); return showReg(); } throw new Error(r.error); }
    cur = r.items; render();
    $("mainErr").textContent = "";
  } catch (e) { $("mainErr").textContent = "목록을 불러오지 못했습니다. 잠시 후 다시 시도합니다."; }
}
let cur = [];
function render() {
  {
    const r = { items: cur };
    const open = r.items.filter((it) => it.st === "접수");
    const done = r.items.filter((it) => it.st !== "접수");
    const waiting = open.length;
    $("big").hidden = false; $("big").classList.toggle("zero", !waiting);
    $("bigN").textContent = waiting ? waiting : "처리할 요청이 없습니다";
    $("bigT").textContent = waiting ? "건 처리 대기" : "";
    $("list").innerHTML =
      (open.length ? open.map(card).join("") : '<div class="empty"><b>새 요청을 기다리는 중입니다</b>요청이 오면 알림이 울립니다.</div>') +
      (done.length ? `<details class="dn"><summary>오늘 확인 ${done.length}건</summary>${done.map(card).join("")}</details>` : "");
    document.querySelectorAll("[data-a]").forEach((b) => b.addEventListener("click", () => act(b)));
    if (focusId) { const el = $("r" + focusId); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); }
  }
}

async function act(b) {
  b.disabled = true;
  // 서버 응답을 기다리지 않고 화면부터 바꾼다(실패하면 아래에서 다시 불러와 원래대로 되돌림)
  const it = cur.find((x) => x.id === b.dataset.id);
  if (it) {
    const t = new Date(), hhmm = String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
    if (it.st === "접수") { it.st = "확인"; it.ackAt = hhmm; it.by = store.get("name"); }
    render();
  }
  try {
    const r = await (await fetch(API, { method: "POST", body: JSON.stringify({
      action: b.dataset.a, id: b.dataset.id, deviceId: store.get("deviceId"), key: store.get("key") }) })).json();
    if (!r.ok) throw new Error(r.error);
  } catch (e) { $("mainErr").textContent = "처리하지 못했습니다: " + e.message; }
  load();
}

$("testBtn").addEventListener("click", async () => {
  $("mainErr").className = "err"; $("mainErr").textContent = "";
  const r = await (await fetch(API, { method: "POST", body: JSON.stringify({
    action: "test", deviceId: store.get("deviceId"), key: store.get("key") }) })).json();
  $("mainErr").className = r.ok ? "ok" : "err";
  $("mainErr").textContent = r.ok ? "테스트 알림을 보냈습니다. 잠시 후 알림이 오면 정상입니다." : "발송하지 못했습니다: " + (r.error || "");
});
$("reset").addEventListener("click", (e) => {
  e.preventDefault();
  if (!confirm("이 폰의 등록을 해제할까요?")) return;
  ["deviceId", "key", "name"].forEach(store.del); showReg();
});

if (!API) { $("reg").hidden = false; $("regErr").textContent = "설정(config.js)이 아직 입력되지 않았습니다."; }
else if (store.get("deviceId") && store.get("key")) showMain();
else showReg();
setInterval(() => { if (!$("main").hidden && !document.hidden) load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("main").hidden) load(); });
</script>
</body>
</html>
