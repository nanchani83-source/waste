<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KNUH 의료폐기물 안전 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: light;
  --bg:#F2F4F7;
  --surface:#FFFFFF;
  --ink:#15202B;
  --ink-soft:#5B6673;
  --ink-faint:#98A2AE;
  --line:#E4E8EC;
  --hero:#1F2D3A;
  --blue:#3A5A8C;
  --teal:#3E6E69;
  --orange:#A8683A;
  --red:#C62828;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans KR", "Malgun Gothic", -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }

/* 상단 */
.hero { background:var(--hero); color:#fff; padding:calc(28px + env(safe-area-inset-top, 0px)) 20px 64px; }
.hero-in { max-width:760px; margin:0 auto; }
.eyebrow { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.12em; color:#A9B7C4; margin-bottom:10px; }
.hero h1 { margin:0; font-size:28px; font-weight:800; letter-spacing:-0.02em; line-height:1.25; }

/* 메뉴 타일 */
main { max-width:760px; margin:-48px auto 0; padding:0 16px 24px; }
.tiles { display:grid; grid-template-columns:1fr; gap:12px; }
.tile { position:relative; display:flex; align-items:center; gap:16px; min-height:84px; padding:12px 18px; border-radius:16px; color:#fff; text-decoration:none; overflow:hidden; box-shadow:0 4px 12px -6px rgba(31,45,58,.35); transition:transform .12s ease, box-shadow .2s ease; -webkit-tap-highlight-color:transparent; }
.tile:hover { box-shadow:0 8px 18px -8px rgba(31,45,58,.4); }
.tile:active { transform:scale(.98); }
.tile-icon { flex:none; width:56px; height:56px; border-radius:14px; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; }
.tile-icon svg { width:30px; height:30px; }
.tile-name { flex:1; font-size:22px; font-weight:700; letter-spacing:-0.02em; line-height:1.25; }
.tile-go { flex:none; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; }
.t-blue   { background:var(--blue); }
.t-teal   { background:var(--teal); }
.t-orange { background:var(--orange); }

/* 공지 */
.notice { margin-top:20px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px 18px 16px; }
.notice-head { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; margin-bottom:10px; }
.notice-head svg { color:var(--blue); }
.notice ul { margin:0; padding:0; list-style:none; }
.notice li { position:relative; padding-left:14px; font-size:14px; line-height:1.7; color:var(--ink-soft); }
.notice li::before { content:""; position:absolute; left:2px; top:11px; width:5px; height:5px; border-radius:50%; background:var(--ink-faint); }
.notice b { color:var(--ink); }
.red { color:var(--red); font-weight:700; }

footer { text-align:center; font-size:15px; font-weight:500; color:var(--ink-soft); padding:12px 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
footer b { color:var(--ink); font-weight:800; }
.copy { margin-top:8px; font-size:12px; font-weight:400; color:var(--ink-faint); }

/* 태블릿·PC: 3열 세로 타일 */
@media (min-width: 640px) {
  .hero h1 { font-size:32px; }
  .tiles { grid-template-columns:repeat(3, 1fr); gap:14px; }
  .tile { flex-direction:column; align-items:flex-start; justify-content:space-between; min-height:150px; padding:18px; }
  .tile-icon { width:60px; height:60px; }
  .tile-icon svg { width:32px; height:32px; }
  .tile-go { position:absolute; right:16px; top:18px; }
}
</style>
</head>

<body>

<header class="hero">
  <div class="hero-in">
    <div class="eyebrow">KNUH</div>
    <h1>의료폐기물 안전 관리</h1>
  </div>
</header>

<main>
  <nav class="tiles">
    <a class="tile t-blue" id="link-container">
      <span class="tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
      </span>
      <span class="tile-name">전용용기 신청</span>
      <span class="tile-go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>

    <a class="tile t-teal" id="link-guide">
      <span class="tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/><path d="M7.8 10.6l1.9 1.9 3.4-3.6"/></svg>
      </span>
      <span class="tile-name">분리배출 가이드</span>
      <span class="tile-go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>

    <a class="tile t-orange" id="link-inspection">
      <span class="tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V3h6v1"/><path d="M9 12.5l2 2 4-4.2"/><path d="M9 17.5h6"/></svg>
      </span>
      <span class="tile-name">지도점검</span>
      <span class="tile-go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>
  </nav>

  <section class="notice">
    <div class="notice-head">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      공지사항
    </div>
    <ul>
      <li>2026년 병원운영계획 : 의료폐기물 감축, 0.68kg/인</li>
      <li>의료폐기물 관련 궁금한점 <b>분리배출 가이드</b>에서 확인하세요.</li>
      <li><span class="red">(분리배출 철저)</span> 의료소모품 포장지는 일반쓰레기 입니다.</li>
      <li>에이프런, 장갑은 작게 말아서 버려주세요.</li>
    </ul>
  </section>
</main>

<footer>
  문의 ☎ <b>2072</b> 시설과 담당자
  <div class="copy">© 2026 KNUH. All rights reserved. · v1.0</div>
</footer>

<script>
// 각 메뉴의 이동 주소. 같은 폴더에 파일을 두면 그대로 사용하고,
// 별도 주소(구글 앱스 스크립트 배포 URL 등)로 운영할 경우 여기만 바꿔주면 됨
const LINKS = {
  container:  "container.html",
  guide:      "guide.html",
  inspection: "inspection.html"
};

Object.keys(LINKS).forEach(k => {
  document.getElementById("link-" + k).href = LINKS[k];
});
</script>

</body>
</html>
