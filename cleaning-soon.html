<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>당직 청소 요청 - 서비스 준비 중</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#15202B; --ink-soft:#5B6673; --ink-faint:#98A2AE;
  --line:#E4E8EC; --hero:#1F2D3A; --blue:#3A5A8C; --clean:#4A5F9E; --red:#C62828;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans KR","Malgun Gothic",-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
.hero { background:var(--hero); color:#fff; padding:calc(28px + env(safe-area-inset-top, 0px)) 20px 64px; }
.hero-in { position:relative; max-width:760px; margin:0 auto; }
.eyebrow { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.12em; color:#A9B7C4; margin-bottom:10px; }
.hero h1 { margin:0; font-size:28px; font-weight:800; letter-spacing:-0.02em; line-height:1.25; }
.back { position:absolute; top:-8px; right:0; display:inline-flex; align-items:center; gap:4px; height:30px; padding:0 12px; border-radius:99px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28); color:#fff; font-size:13px; font-weight:700; text-decoration:none; }
main { max-width:760px; margin:-48px auto 0; padding:0 16px 24px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px 20px; box-shadow:0 4px 12px -6px rgba(31,45,58,.25); }
.soon { text-align:center; }
.soon-ico { width:56px; height:56px; margin:0 auto 14px; border-radius:16px; background:var(--clean); color:#fff; display:flex; align-items:center; justify-content:center; }
.soon-ico svg { width:30px; height:30px; }
.soon h2 { margin:0 0 8px; font-size:22px; font-weight:800; letter-spacing:-0.02em; }
.soon p { margin:0; font-size:15px; line-height:1.7; color:var(--ink-soft); }
.soon p b { color:var(--ink); }
.btn { display:flex; align-items:center; justify-content:center; height:50px; margin-top:18px; border-radius:13px; background:var(--hero); color:#fff; font-weight:800; font-size:16px; text-decoration:none; }
.notice { margin-top:16px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px 18px 16px; }
.notice-head { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; margin-bottom:10px; }
.notice-head svg { color:var(--blue); }
.notice ul { margin:0; padding:0; list-style:none; }
.notice li { position:relative; padding-left:14px; font-size:14px; line-height:1.7; color:var(--ink-soft); }
.notice li::before { content:""; position:absolute; left:2px; top:11px; width:5px; height:5px; border-radius:50%; background:var(--ink-faint); }
.notice b { color:var(--ink); }
footer { text-align:center; font-size:15px; font-weight:500; color:var(--ink-soft); padding:12px 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
footer b { color:var(--ink); font-weight:800; }
.copy { margin-top:8px; font-size:12px; font-weight:400; color:var(--ink-faint); }
@media (min-width:640px) { .hero h1 { font-size:32px; } }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <a class="back" href="index.html">‹ 처음으로</a>
    <div class="eyebrow">KNUH</div>
    <h1>당직 청소 요청</h1>
  </div>
</header>

<main>
  <section class="card soon">
    <div class="soon-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3l1.9 5.4L18.5 10l-5.6 1.7L11 17l-1.9-5.3L3.5 10l5.6-1.6z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/></svg>
    </div>
    <h2>서비스 준비 중입니다</h2>
    <p>당직 청소 요청 서비스를 곧 시행할 예정입니다.<br>시행 전까지는 기존처럼 <b>당직실 ☎ 2342</b>로 연락해 주세요.</p>
    <a class="btn" href="index.html">처음으로 돌아가기</a>
  </section>

  <section class="notice">
    <div class="notice-head">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      공지사항
    </div>
    <ul>
      <li><b>평일</b> 당직 16:00~19:00 (5명)</li>
      <li><b>토요일</b> 당직 08:00~17:00 (25명)</li>
      <li><b>일요일 및 공휴일</b> 당직 08:00~17:00 (10명)</li>
      <li>당직실 전화번호 ☎ <b>2342</b></li>
    </ul>
  </section>
</main>

<footer>
  문의 ☎ <b>2072</b> 시설과 담당자
  <div class="copy">© 2026 KNUH. All rights reserved.</div>
</footer>

</body>
</html>
