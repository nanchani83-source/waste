<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>의료폐기물 분리배출 가이드 · KNUH 환경미화팀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F4;
    --surface:#FFFFFF;
    --surface-2:#EEF1EE;
    --ink:#152325;
    --ink-soft:#54656A;
    --ink-faint:#8A9A9C;
    --line:#DDE3DF;
    --brand:#0E3B3C;
    --brand-2:#1F6E67;
    --brand-tint:#E4EFEC;
    --red:#B8394B;
    --red-tint:#F7E6E7;
    --yellow:#B9861F;
    --yellow-tint:#F8EFD8;
    --black-tag:#2A2C30;
    --black-tint:#E7E7E9;
    --green:#2F7A55;
    --green-tint:#E4F0E8;
    --blue:#3A5F7D;
    --blue-tint:#E5ECF1;
    --purple:#6E4E7D;
    --purple-tint:#EFE7F1;
    --amber:#9C6B1F;
    --amber-tint:#F4E9D6;
    --cyan:#2C7A82;
    --cyan-tint:#E1EEEE;
    --radius:14px;
    --radius-sm:9px;
    --safe-t:env(safe-area-inset-top, 0px);
    --safe-b:env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg:#12181A;
      --surface:#1A2224;
      --surface-2:#212B2D;
      --ink:#EAF0EF;
      --ink-soft:#A9BBBB;
      --ink-faint:#728485;
      --line:#2C3739;
      --brand:#2A8A82;
      --brand-2:#3DA89E;
      --brand-tint:#1D3532;
      --red:#E08894;
      --red-tint:#3A2226;
      --yellow:#E3BE72;
      --yellow-tint:#3A311D;
      --black-tag:#C9CCD1;
      --black-tint:#2A2D31;
      --green:#7BC49B;
      --green-tint:#1E3327;
      --blue:#8FB4CF;
      --blue-tint:#1F2C36;
      --purple:#C6A6D6;
      --purple-tint:#2C2431;
      --amber:#E0BD86;
      --amber-tint:#332A1A;
      --cyan:#7FC7CD;
      --cyan-tint:#1B2E30;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12181A;
    --surface:#1A2224;
    --surface-2:#212B2D;
    --ink:#EAF0EF;
    --ink-soft:#A9BBBB;
    --ink-faint:#728485;
    --line:#2C3739;
    --brand:#2A8A82;
    --brand-2:#3DA89E;
    --brand-tint:#1D3532;
    --red:#E08894;
    --red-tint:#3A2226;
    --yellow:#E3BE72;
    --yellow-tint:#3A311D;
    --black-tag:#C9CCD1;
    --black-tint:#2A2D31;
    --green:#7BC49B;
    --green-tint:#1E3327;
    --blue:#8FB4CF;
    --blue-tint:#1F2C36;
    --purple:#C6A6D6;
    --purple-tint:#2C2431;
    --amber:#E0BD86;
    --amber-tint:#332A1A;
    --cyan:#7FC7CD;
    --cyan-tint:#1B2E30;
  }

  *{box-sizing:border-box;}
  html{scroll-padding-top:calc(112px + var(--safe-t));}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR", -apple-system, "Malgun Gothic", sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(28px + var(--safe-b));
  }
  a{color:inherit;}

  /* ===== 상단 바 (메인 버튼) — 모든 세부 페이지 공통 ===== */
  header.top{
    position:sticky; top:0; z-index:30;
    background:var(--brand);
    color:#fff;
    padding-top:var(--safe-t);
    box-shadow:0 4px 14px -6px rgba(15,23,42,.35);
  }
  .appbar-in{
    max-width:760px; margin:0 auto; height:64px; padding:0 14px;
    display:flex; align-items:center; gap:12px;
  }
  .appbar-home{
    flex:none; display:inline-flex; align-items:center; gap:2px;
    height:38px; padding:0 14px 0 8px; border-radius:999px;
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.24);
    color:#fff; text-decoration:none; font-size:14px; font-weight:700;
    -webkit-tap-highlight-color:transparent;
  }
  .appbar-home:hover{background:rgba(255,255,255,.24);}
  .appbar-home:active{transform:scale(.96);}
  .appbar-title{flex:1; min-width:0; display:flex; flex-direction:column;}
  .appbar-title h1{
    margin:0; font-size:17px; font-weight:800; letter-spacing:-0.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .appbar-title p{
    margin:0; font-size:12px; opacity:.78; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  /* 가이드 첫 화면으로 (검색 초기화) */
  .appbar-reset{
    flex:none; width:38px; height:38px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid rgba(255,255,255,.24); color:#fff; cursor:pointer;
  }
  .appbar-reset:hover{background:rgba(255,255,255,.14);}

  .searchwrap{
    position:sticky; top:calc(64px + var(--safe-t)); z-index:29;
    background:var(--bg);
    padding:12px 16px 8px;
    border-bottom:1px solid var(--line);
  }
  .searchbox{
    position:relative;
    display:flex; align-items:center;
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:0 6px 0 16px;
    height:48px;
    transition:border-color .15s ease;
  }
  .searchbox:focus-within{border-color:var(--brand-2);}
  .searchbox svg{flex:none; opacity:.55;}
  .searchbox input{
    flex:1; border:0; outline:0; background:transparent;
    font:inherit; font-size:15px; color:var(--ink); padding:0 8px;
    min-width:0;
  }
  .searchbox input::placeholder{color:var(--ink-faint);}
  .clearbtn{
    display:none; flex:none; width:34px; height:34px; border-radius:50%;
    border:0; background:var(--surface-2); color:var(--ink-soft);
    font-size:16px; cursor:pointer; align-items:center; justify-content:center;
  }
  .clearbtn.show{display:flex;}

  .chiprow{
    display:flex; gap:8px; overflow-x:auto; padding:10px 16px 12px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; white-space:nowrap;
    font-size:13px; font-weight:600; color:var(--brand-2);
    background:var(--brand-tint);
    border:1px solid transparent;
    padding:7px 13px; border-radius:999px; cursor:pointer;
  }
  .chip:active{transform:scale(.97);}

  main{padding:4px 16px 40px;}
  .section-title{
    font-size:13px; font-weight:700; color:var(--ink-soft);
    margin:22px 2px 10px; display:flex; align-items:center; gap:6px;
  }
  .section-title .count{
    font-weight:500; color:var(--ink-faint); font-size:12px;
  }

  /* Quick judgment cards */
  .qgrid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
  }
  .qcard{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 13px 12px;
    cursor:pointer;
    display:flex; flex-direction:column; gap:8px;
    min-height:118px;
  }
  .qcard:active{background:var(--surface-2);}
  .tag{
    align-self:flex-start;
    font-size:10.5px; font-weight:700;
    padding:3px 8px; border-radius:6px;
    letter-spacing:.01em;
  }
  .qcard .qtitle{
    font-size:13.5px; font-weight:600; line-height:1.4; color:var(--ink);
  }
  .qcard .qresult{
    margin-top:auto;
    font-size:12.5px; font-weight:700;
  }
  .qcard .qresult.pos{color:var(--red);}
  .qcard .qresult.neg{color:var(--brand-2);}

  /* Browse accordions */
  .acc{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:8px;
    overflow:hidden;
  }
  .acc-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 15px; cursor:pointer; gap:10px;
  }
  .acc-head .left{display:flex; align-items:center; gap:10px; min-width:0;}
  .acc-head .dot{
    width:8px; height:8px; border-radius:50%; flex:none;
  }
  .acc-head h3{
    font-size:14.5px; font-weight:700; margin:0; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .acc-head .n{
    font-size:12px; color:var(--ink-faint); font-weight:500; flex:none;
  }
  .acc-head .chev{
    flex:none; transition:transform .18s ease; color:var(--ink-faint);
  }
  .acc.open .acc-head .chev{transform:rotate(180deg);}
  .acc-body{
    display:none;
    padding:0 15px 14px;
  }
  .acc.open .acc-body{display:block;}

  .qa-item{
    border-top:1px solid var(--line);
    padding:12px 0;
  }
  .qa-item:first-child{border-top:0; padding-top:2px;}
  .qa-q{
    display:flex; gap:8px; align-items:flex-start;
    font-size:13.5px; font-weight:600; color:var(--ink);
    cursor:pointer; line-height:1.5;
  }
  .qa-q .qmark{
    flex:none; width:20px; height:20px; border-radius:6px;
    background:var(--brand-tint); color:var(--brand-2);
    font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .qa-a{
    display:none;
    margin:9px 0 0 28px;
    font-size:13px; line-height:1.65; color:var(--ink-soft);
    white-space:pre-line;
  }
  .qa-item.open .qa-a{display:block;}
  .qa-id{
    font-size:11px; color:var(--ink-faint); font-weight:600; margin-left:28px;
  }

  .sec-item{
    border-top:1px solid var(--line);
    padding:12px 0;
    font-size:13px; line-height:1.7; color:var(--ink-soft);
    white-space:pre-line;
  }
  .sec-item:first-child{border-top:0;}
  .sec-item .sec-title{
    font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:6px;
    display:block;
  }

  mark{
    background:var(--yellow-tint); color:var(--ink);
    border-radius:3px; padding:0 2px; font-weight:700;
  }

  /* Search results */
  .result{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 15px;
    margin-bottom:9px;
  }
  .result .rmeta{
    display:flex; align-items:center; gap:7px; margin-bottom:7px;
  }
  .result .rq{
    font-size:14px; font-weight:700; line-height:1.5; color:var(--ink);
    cursor:pointer;
  }
  .result .ra{
    margin-top:9px; font-size:13px; line-height:1.65; color:var(--ink-soft);
    white-space:pre-line;
  }
  .result .ra.collapsed{
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .more-link{
    display:none; align-items:center; gap:4px;
    font-size:12.5px; font-weight:700; color:var(--brand-2);
    margin-top:8px; cursor:pointer; padding:4px 0;
  }
  .more-link.show{display:inline-flex;}
  .more-link svg{transition:transform .18s ease;}
  .more-link.expanded svg{transform:rotate(180deg);}
  .qa-q .qchev{flex:none; margin-left:auto; margin-top:3px; color:var(--ink-faint); transition:transform .18s ease;}
  .qa-item.open .qchev{transform:rotate(180deg);}

  .empty{
    text-align:center; padding:52px 20px; color:var(--ink-faint);
  }
  .empty .big{font-size:32px; margin-bottom:10px;}
  .empty p{font-size:13.5px; line-height:1.6; margin:4px 0;}

  footer{
    padding:26px 20px 10px; text-align:center;
    color:var(--ink-faint); font-size:11.5px; line-height:1.7;
  }

  .backtotop{
    position:fixed; right:16px; bottom:calc(18px + var(--safe-b));
    width:44px; height:44px; border-radius:50%;
    background:var(--brand); color:#fff; border:0;
    display:none; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.22);
    z-index:40; cursor:pointer;
  }
  .backtotop.show{display:flex;}

</style>
</head>
<body>

<header class="top">
  <div class="appbar-in">
    <a class="appbar-home" href="index.html" aria-label="메인 화면으로">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>메인
    </a>
    <div class="appbar-title">
      <h1>분리배출 가이드</h1>
      <p>분리배출 지침 제4판(2026.8) 기준</p>
    </div>
    <button class="appbar-reset" id="homeBtn" type="button" aria-label="가이드 처음으로" title="가이드 처음으로"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
  </div>
</header>

<div class="searchwrap">
  <div class="searchbox">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchInput" type="text" inputmode="search" placeholder="예: 일회용기저귀, 미사용 주사기, 보관기간..." autocomplete="off">
    <button class="clearbtn" id="clearBtn" aria-label="지우기">✕</button>
  </div>
  <div class="chiprow" id="chipRow"></div>
</div>

<main>
  <div id="view-home">
    <div class="section-title">현장에서 자주 헷갈리는 판정</div>
    <div class="qgrid" id="quickCards"></div>

    <div class="section-title">지침 목차로 찾아보기</div>
    <div id="chapterAcc"></div>

    <div class="section-title">주요 질의회신 사례 <span class="count" id="qaTotalCount"></span></div>
    <div id="qaAcc"></div>
  </div>

  <div id="view-search" style="display:none"></div>
</main>

<footer>
  「의료폐기물 분리배출 지침 - 제4판」기후에너지환경부 폐자원관리과 (2026.8) 및 「폐기물관리법」 기준<br>

</footer>

n  마. 혈액오염폐기물: 폐혈액백, 혈액투석 시 사용된 폐기물, 그 밖에 혈액이 유출될 정도로 포함되어 있어 특별한 관리가 필요한 폐기물\n 3. 일반의료폐기물\n  가. 혈액이 함유되어 있는 탈지면, 붕대, 거즈, 일회용 기저귀, 생리대, 일회용  주사기 또는 수액세트\n  나. 혈액이 함유되지 않은 다음의 폐기물. 다만, 「국민건강보험법」 제52조제1항에 따른 건강검진 또는 기후에너지환경부령으로 정하는 검진에서 발생한 것은 제외한다.\n    1) 체액\n    2) 분비물\n    3) 체액ㆍ분비물ㆍ배설물이 함유되어 있는 탈지면, 붕대, 거즈, 일회용 기저귀, 생리대, 일회용 주사기 또는 수액세트\n비고\n1. 의료폐기물이 아닌 폐기물로서 의료폐기물과 혼합되거나 접촉된 폐기물은 혼합되거나 접촉된 의료폐기물과 같은 폐기물로 본다.\n2. 채혈진단에 사용된 혈액이 담긴 검사튜브, 용기 등은 조직물류폐기물로 본다.\n3. 제3호나목3)의 일회용 기저귀는 「감염병의 예방 및 관리에 관한 법률」 제2조제13호부터 제15호까지의 규정에 따른 감염병환자, 감염병의사환자 또는 병원체보유자(이하 \"감염병환자등\"이라 한다)가 사용한 일회용 기저귀로 한정한다. 다만, 일회용 기저귀를 매개로 한 전염 가능성이 낮다고 판단되는 감염병으로서 기후에너지환경부장관이 고시하는 감염병 관련 감염병환자등이 사용한 일회용 기저귀는 제외한다.   ※ 해당 고시 없음", "chapter": "1장 · 의료폐기물 개요"}, {"code": "1.4", "title": "의료폐기물 판정 흐름도", "body": "   ※ 상기 흐름도는 절대적인 것이 아니므로, 참고용으로만 활용 바랍니다.\n2장\n 의료폐기물의 발생, 보관, 배출, 처리 등 기준", "chapter": "1장 · 의료폐기물 개요"}, {"code": "2.1", "title": "의료폐기물 발생(전용용기 사용법)", "body": " ◦ 의료폐기물은 발생했을 때, 즉 해당 진찰·치료 및 시험·검사행위가 끝났을 때부터 종류별로 적합한 전용용기에 넣어 보관\n     ※ 법률 상 의료폐기물 정의를 고려하여 보건･의료기관 등에서 배출되는 폐기물 중에서 인체 감염우려, 인체조직물 등은 의료폐기물로 분류･처리 (예: 낙상 후 발생 조직물류)\n <전용용기 사용>\n ◦ 의료폐기물 전용용기 숙지[봉투형 용기, 상자형 용기(골판지류, 합성수지류)]\n  구분\n용기 사진\n해당 의료폐기물\n합성수지류\n상자형 용기\n•격리의료폐기물\n•조직물류폐기물(치아 제외)\n•손상성폐기물\n•액체상태 폐기물\n봉투형용기 또는 골판지류\n상자형 용기\n•조직물류폐기물(치아)\n•병리계폐기물\n•생물·화학폐기물\n•혈액오염폐기물\n•일반의료폐기물\n ◦ 전용용기는 환경부장관이 지정한 검사기관이 별도의 검사기준에 따라 검사하여 합격한 제품만 사용(허가받은 등록 업체만 제조 가능)\n ◦ 전용용기의 바깥쪽에 도형과 취급시 주의사항란이 표시되어 있는지 확인하고, 도형색상은 의료폐기물 종류별로 상이한 점 유의\n의료폐기물 종류\n도형색상\n 격리의료폐기물\n붉은색\n 위해의료폐기물(재활용하는 태반은 제외) 및 일반의료폐기물\n봉투형 용기\n검정색\n상자형 용기\n노란색\n 재활용하는 태반\n녹색\n   ※ (도형색상) 붉은색으로 표시하여야 하는 의료폐기물과 노란색 또는 검정색으로 표시하여야 하는 의료폐기물을 혼합 보관할 때에는 붉은색으로 표시\n< 취급 시 주의사항 >\n 이 폐기물은 감염의 위험성이 있으므로 주의하여 취급하시기 바랍니다.\n 배출자\n 종류 및 성질과 상태\n 사용개시 연월일\n 수거자\n    ※ (사용개시 연월일) 의료폐기물을 최초로 넣은 날을 기재, 사용개시 연월일부터 배출자의 보관기간 산정\n ◦ 의료폐기물 배출량에 맞는 규격의 전용용기를 사용하여 과대 용기 사용에 따른 자원이용 비효율 지양\n ◦ 전용용기 재고 및 수급계획을 지속적으로 모니터링하여 용기 부족 상황이 발생하지 않도록 관리\n   - 용기 부족 상황 발생 시에는 전국 제조업체 현황(기후부 누리집)을 참조하거나 관할 환경청으로 연락하여 재고가 있는 제조업체에서 전용용기를 공급받을 수 있도록 요청\n <전용용기에 넣기 어려운 경우>\n ◦ 전용용기 규격과 통상의 전용용기 크기를 현저히 초과하는 대형 조직물류폐기물 등이 발생하여 전용용기에 넣기 어려운 경우에는 내용물이 보이지 않게 개별 포장하고 내용물이 새어 나오지 않게 밀폐 포장\n    ※ 포장 바깥쪽에 ｢폐기물관리법｣ 시행규칙 별표5에 따른 의료폐기물 도형, 취급시 주의사항을 반드시 표기하여 오인 방지\n ◦ 특히, 조직물류폐기물(신체의 일부 등)의 경우에는 부패의 우려가 높은 특성을 고려해 개별･밀폐 포장하였으면 지체 없이 냉장시설에 보관 또는 처리업체에 인계･인수\n <전용용기 사용 시 준수사항>\n ◦ 사용 중인 전용용기는 내부의 폐기물이 새지 아니하도록 관리\n ◦ 투입이 끝난 전용용기는 밀폐 포장하고, 사용한 전용용기는 재사용 금지\n ◦ 봉투형 용기는 의료폐기물을 그 용량의 75% 이상이 되도록 넣어서는 안되며, 위탁처리시 상자형 용기에 담아 배출(상자형은 75%이상 가능)\n ◦ 골판지류 상자형 용기의 내부에는 봉투형 용기 또는 내부 주머니를 붙이거나 넣어서 사용해야 함\n    ※ 봉투형 용기와 내부 주머니는 취급 안전을 고려해 안전규격을 두고 있는 바, 2장 이상 사용하거나 내부주머니와 봉투형 용기를 같이 사용하는 등 다중 포장으로 배출하는 행위 지양 (자원이용 효율 증진 + 사용자 비용 절감)\n ◦ 봉투형 용기에 별도 거치대를 사용하는 것도 가능, 거치대는 봉투형 용기의 파손을 방지할 수 있는 견고한 재질로 하고, 내부를 확인할 수 있는 것(투명 플라스틱통 등)이 바람직하며 사용 후 소독 필요\n    ※ 봉투형 용기를 단독으로 사용하여 의료폐기물을 수집하는 경우, 봉투형 용기 표면에 사용개시일을 반드시 기입하여야 함. 위탁처리를 위해 상자형 용기에 옮겨 담을 경우, 상자형 용기 표면에는 봉투형 용기 사용개시일을 동일하게 기입해야 함\n ◦ 의료폐기물을 담은 봉투형 용기를 이동할 때는 뚜껑이 있고 견고한 전용 운반구를 사용해야 하며, 사용한 운반구는 「감염병의 예방법 시행규칙」별표 6 제2호 라목에 따른 약물소독의 방법으로 소독하여야 함\n    ※ 「감염병 예방법 시행규칙」별표6 제5호에 따라, 「생활화학제품 및 살생물제의 안전관리에 관한 법률」 제3조제4호에 따른 안전확인대상 생활화학제품(살균제품 및 구제제품으로 한정한다) 또는 같은 조 제8호에 따른 살생물제품(살균제류 및 구제제류로 한정한다)으로서 환경부장관의 승인을 받은 상품화된 약품을 사용할 수 있음\n ◦ 전용용기에 서로 다른 의료폐기물을 혼합 보관 가능, 다만, 합성수지류 상자형 용기를 사용해야 하는 의료폐기물을 봉투형 용기 또는 골판지류 상자형 용기에는 보관 금지\n   - 격리의료폐기물과 혼합된 경우 격리의료폐기물로 표기\n   - 보관기간, 보관방법 등에 있어 엄격한 기준을 적용\n      ※ 사용개시일은 혼합된 것 중 가장 빠른 것으로 표기\n <전용용기 사용 시 권장사항>\n   ※ 법적사항은 아니나, 안전관리를 위해 권장하는 사항\n ㅇ 곤충 등 매개체로 인한 감염 전파를 차단하고, 악취 발생 저감을 위해 덮개 또는 뚜껑을 사용\n   - 전용용기 내부의 의료폐기물이 외부에 노출되지 않도록 틈새 공간이 발생하지 않는 공산품이나 자체 제작 덮개 또는 뚜껑을 사용\n<뚜껑 장착 예시 (여닫이 형식 또는 덮개 형식)>\n(개선 전)\n(개선 후)\n    ※ 공산품 중 의료폐기물 배출기관에서 사용하는 전용용기 규격에 맞는 제품 사용, 상기 용기 뚜껑·덮개 외에도 용량에 적합한 공산품 사용 가능 ex) 주방용품, 쓰레기통 덮개 등\n   - 틈새가 발생하는 경우 밴딩, 테이핑 등의 방법으로 밀폐하여 감염 전파 우려 최소화\n   - 직사광선, 전자제품 주변 등 열이 발생하는 장소와 이격된 공간에 일반쓰레기통과 구분되도록 비치하여 비의료폐기물의 혼합 차단\n ㅇ 손잡이, 뚜껑·덮개 등 접촉으로 인한 감염 위험이 있는 부분은 일 1회 이상 약물소독\n <전용용기 표기 + 전자태그 부착>\n ◦ 전용용기 취급시 주의사항의 ’종류 및 성질과 상태‘ 란에는 혼합보관하는 의료폐기물의 종류별로 기재하고, 가장 많은 비중을 차지하는 의료폐기물 종류로 전자태그를 발행하여 배출\n ◦ 여러 소형 전용용기들을 대형 전용용기에 담을 경우, 대형 전용용기에만 전자태그 1개만 부착\n ◦ 여러 소형 전용용기들을 非전용용기(포대, 마대 등)에 담을 경우, 소형 전용용기에 모두 개별 전자태그 1개씩 부착\n <재활용 태반, 격리의료폐기물 유의사항>\n ◦ 재활용 태반은 발생한 때부터 흰색의 투명한 합성수지 내부 주머니에 의료기관명, 중량(g), 발생일자, 담당의사명을 기재한 후 1개씩 포장하여 전용용기에 넣어 냉장시설에 보관\n ◦ 격리의료폐기물을 넣은 전용용기는 용기를 밀폐하기 전에 용기의 내부를, 처리하기 위하여 보관시설 외부로 반출하기 전에 용기의 외부를 각각 약물소독 하여야 함", "chapter": "2장 · 발생·보관·배출·처리 기준"}, {"code": "2.2", "title": "의료폐기물의 보관", "body": " ◦ 의료폐기물 종류별로 정해진 보관기간을 초과하여 보관할 수 없으나, 천재지변, 휴업, 시설 보수 및 그 밖의 부득이한 사유로서 시·도지사 및 지방환경관서 장의 인정을 받은 경우 예외 가능\n    ※ 보관기간은 24시간 기준으로 계산, 보관 만료일이 공휴일인 경우 익일배출 원칙\n ◦ 의료폐기물 종류별로 적정한 보관시설에 보관하여야 하며, 보관시설은 전용의 냉장시설, 밀폐된 전용의 보관창고*로 구분\n   * 의원, 보건지소, 보건진료소, 혈액원, 검역소, 동물검역기관, 동물병원, 국가나 지자체 시험․연구기관, 학술연구나 제품의 제조․발명에 관한 시험․연구소, 장례식장, 교도소․소년교도소․구치소 등에 설치된 의무시설, 기업체 부속 의무시설(100㎡ 이상), 사단급 이상 군부대에 설치된 의무시설, 노인요양시설은 밀폐된 전용 보관창고가 아닌 별도의 보관장소에 보관 가능\n종 류\n보관시설\n전용용기*\n도형 색상\n(위탁처리 시)\n배출자\n보관기간\n격리의료\n폐기물\nㅇ 격리의료 폐기물\n  - 밀폐된 전용 보관창고\nㅇ 조직물류와 성상이 같은 경우\n  - 전용 냉장시설(4℃ 이하)\n상자형\n(합성수지)\n붉은색\n7일\n위해\n의료\n폐기물\n조직물류\nㅇ 전용 냉장시설(4℃ 이하)\n상자형\n(합성수지)\n노란색\n15일\n조직물류\n(치아)\nㅇ 밀폐된 전용 보관창고\n상자형\n(골판지)\n노란색\n60일\n조직물류(태반)\nㅇ 전용 냉장시설(4℃ 이하)\n상자형\n(합성수지)\n녹색\n15일\n병리계\nㅇ 밀폐된 전용 보관창고\n상자형\n(골판지)\n노란색\n15일\n손상성\nㅇ 밀폐된 전용 보관창고\n상자형\n(합성수지)\n노란색\n30일\n생물ㆍ화학\nㅇ 밀폐된 전용 보관창고\n상자형\n(골판지)\n노란색\n15일\n혈액오염\nㅇ 밀폐된 전용 보관창고\n상자형\n(골판지)\n노란색\n15일\n일반의료\n폐기물\nㅇ 밀폐된 전용 보관창고\n상자형\n(골판지)\n노란색\n15일**\n   * 격리, 조직물, 손상계, 액체 상태 의료폐기물은 반드시 상자형(합성수지) 사용\n  ** 일반의료폐기물 중 입원실이 없는 의원, 치과의원 및 한의원에서 발생되는 것으로 섭씨 4℃이하로 냉장보관하는 경우 30일까지 가능\n ◦ 보관창고 기준\n   - 바닥과 안벽은 타일ㆍ콘크리트 등 물에 견디는 성질의 자재로 설치하여야 하며, 세척이 쉬워야 하고 항상 청결 유지\n   - 소독약품 및 장비 비치\n   - 밖에서 볼 수 없는 구조, 외부인의 출입 제한, 주 1회 이상 약물소독\n   - 보관중인 폐기물의 종류ㆍ양 및 보관기간 등을 기재한 표지판을 설치\n< 의료폐기물 보관표지판 >\n의료폐기물 보관표지\n①폐기물종류:\n②총보관량 : 킬로그램\n③보관기간:\n④관리책임자:\n⑤취급시 주의사항\n  ○보관 시:\n  ○운반 시:\n⑥운반장소:\n   ※ ① (설치위치) 보관창고와 냉장시설의 출입구 또는 출입문에 각각 부착\n      ② (규격) 가로 60cm이상×세로 40cm이상(냉장시설은 가로 30cm이상×세로 20cm이상)\n      ③ (색깔) 흰색 바탕에 녹색 선과 녹색 글자\n ◦ 냉장시설\n   - 4℃ 이하의 설비를 갖추고, 보관중에는 냉장설비를 항상 가동하여야 하며 정상 가동되는 온도계 부착", "chapter": "2장 · 발생·보관·배출·처리 기준"}, {"code": "2.3", "title": "의료폐기물의 배출 및 수집·운반", "body": " ◦ 의료폐기물의 배출\n   - 배출자는 해당 의료폐기물에 대한 배출, 수집·운반, 처리 전과정이   적정하게 이루어지도록 관리할 일차적인 책임이 있으므로, 인수·인계 및 처리사항을 올바로시스템에서 인계후 확인 및 조치\n     ※ 배출자가 수집·운반업자에게 인계서 입력 등 배출자의 역할을 일임하였다가 처리업자에게 폐기물이 제대로 인계되지 않아 처분 대상이 되는 사례 발생\n   - 사업장별 의료폐기물 처리담당자는 법정교육을 수료하고, 직원(폐기물 취급 종사자 포함)에게 의료폐기물 분리배출에 유의토록 교육하여 의료폐기물이 다른 폐기물로 배출되지 않도록 유의하여야 함\n ◦ 전용용기에 넣어 밀폐 포장된 상태로 전용 운반차량으로 수집·운반\n ◦ 수집․운반차량\n   - 4℃ 이하의 냉장설비가 설치되고 운반 중에는 항상 냉장설비를 가동\n   - 밀폐된 적재함 설치\n    ․의료폐기물은 흩날림․유출 및 악취의 새어 나옴을 방지할 수 있는 밀폐된 적재함이 설치된 차량으로 운반\n    ․적재함 내부는 물에 견디는 성질의 자재로서 약물소독을 쉽게 할 수 있는 구조로 온도계를 붙이고, 약물소독에 쓰이는 소독약품, 분무기 등 소독장비와 이를 보관할 수 있는 설비를 갖추어야 함\n    ․적재함은 사용할 때마다 약물소독의 방법으로 소독\n   - 차량의 차체는 흰색으로 색칠하고, 적재함의 양쪽 옆면에는 의료폐기물의 도형, 업소명 및 전화번호를, 뒷면에는 의료폐기물의 도형을 붙이거나 표기\n ◦ 임시보관장소에 보관하는 경우\n   - 4℃ 이하의 냉장 전용보관시설에 보관하는 경우 5일 이내 보관 가능\n   - 그 밖의 보관시설에 보관하는 경우 2일 이내 보관 가능\n   - 격리의료폐기물은 보관시설과 무관하게 2일 이내 보관 가능\n   - 임시보관장소가 없는 경우, 배출장소에서 소각장으로 지체없이 운반\n   - 임시보관장소 주차 차량 내 보관 불가", "chapter": "2장 · 발생·보관·배출·처리 기준"}, {"code": "2.4", "title": "의료폐기물의 처리", "body": " ◦ 의료폐기물은 재활용 금지, 다만, 「약사법」에 따라 태반을 원료로 하는 의약품 제조업 허가를 받은 자가 그 원료로 이용하는 경우에만 재활용 가능\n      ※ 인체유래 지방은 ’27.7월부터 재활용 가능(폐기물관리법 제13조의2, ‘26.7.개정)\n ◦ 그 외 의료폐기물은 위탁(소각)하여 처리하거나, 자가처리(소각, 멸균분쇄)\n ◦ 폐기물 중간처분업은 소각만 가능, 의료폐기물 배출자가 설치하는 자가 처분시설은 소각 및 멸균･분쇄만 가능\n   - 격리의료폐기물, 조직물류폐기물, 생물화학폐기물, 및 보관·운반 시 혈액·체액·분비물·배설물 등이 흘러내릴 수 있는 물질을 포함한 의료폐기물은 반드시 소각으로 처리(멸균분쇄 불가)\n ◦ 의료폐기물을 소각시설, 멸균분쇄시설 투입 전까지 전용용기로부터 해체하여서는 아니되며, 용기에 담은 상태로 투입\n ◦ 멸균분쇄 잔재물(사업장일반폐기물)은 반드시 소각 처리\n ◦ 환자의 혈액이나 혈액･분비물･배설물 등이 섞인 물 등 액체상태 의료폐기물은 「물환경보전법」 제2조제12호에 따른 수질오염방지시설에 직접 유입하여 처리하는 경우로서, 그 배출시설의 설치 허가권자가 인정하는 경우 예외가 인정(「폐관법 시행규칙」제10조)\n ◦ 의료폐기물 소각장에서 보관하는 경우\n   - 1일 처분능력의 5일분 보관량 이하, 5일 이내\n   - 격리의료폐기물, 조직물류폐기물은 2일분 보관량 이하, 2일 이내\n ◦ 의료폐기물 소각잔재물(소각재, 비산재, 바닥재 등)은 반드시 매립 처리\n3장\n 의료폐기물 분리배출", "chapter": "2장 · 발생·보관·배출·처리 기준"}, {"code": "3.1", "title": "분리배출 필요성", "body": " ◇ 의료기관에서 불필요하게 과다한 양이 배출되는 경우 처리시설 용량 부족 상황이 발생되어 처리단가 상승, 비용부담 등의 원인\n  ※ 의료기관 발생 모든 폐기물 ≠ 의료폐기물\n     의료기관 발생 감염 우려 폐기물 = 의료폐기물\n□ 일반폐기물 혼합 배출로 불필요한 의료폐기물 증가\n ◦ 의료폐기물 전용용기별로 상당량의 일반폐기물(포장재, 플라스틱 등)이 혼합 배출되는 것으로 확인\n ◦ 재활용 가능한 일반폐기물이 의료폐기물로 배출되는 경우 재활용자원 감소 및 의료폐기물 처리비용 증가를 초래\n    ※ 의료폐기물 소각시설 부족 및 처리단가 상승으로 불법방치 등 사회문제 발생사례\n□ 발생량 증가에 대비하여 이를 처리할 수 있는 처리시설 확충은 제한적\n ◦ 의료폐기물은 감염성 우려에 따라 전용 처리시설에서만 처리 가능하나 의료폐기물 발생량은 급증하여도 처리업체 처리용량은 충분한 확보가 어려움\n ◦ 주민 및 지자체의 입지 반대가 강해 의료폐기물 처리시설의 신규 설치나 시설 증설 곤란\n ◦ 발생량 증가는 처리단가 상승의 원인이 되며, 향후 의료폐기물을 적정하게 위탁하지 못해 병원내 장기 보관해야 되는 상황까지 발생 우려\n<非의료폐기물이 의료폐기물 전용용기에 혼입된 사례>\n□ 생활폐기물이 혼입된 경우\n□ 폐백신, 폐항암제, 폐화학치료제가 아닌 바이알 등이 혼입된 경우\n□ 포장재 등이 혼입된 경우", "chapter": "3장 · 분리배출 방법"}, {"code": "3.2", "title": "의료폐기물에 해당하지 않는 사례", "body": " ◦ 가정에서 발생한 주사바늘, 혈당검사 침, 기저귀 ⇨ 생활폐기물\n ◦ 가정에서 발생한 폐의약품 ⇨ 생활계유해폐기물(처리방법 지자체 문의)\n ◦ 의학·치과의학·한의학·약학·수의학이 아닌 분야(식품 LMO 등)의 연구기관에서   발생한 시험에 사용된 배양액 등 ⇨ 생활 또는 사업장일반폐기물\n ◦ 의료폐기물 발생기관이 아닌 사업장(축산농가 등)에서 발생하는 폐의약품, 폐백신, 주사기 등 ⇨ 지자체 방침에 따라 처리\n ◦「폐기물관리법」의 적용범위에 해당하지 않는 경우(법 제3조)\n   - 「하수도법」에 따른 하수·분뇨\n   - 「가축전염병예방법」 제22조제2항, 제23조, 제33조 및 제44조가 적용되는 가축의 사체, 오염물건, 수입금지 물건 및 검역 불합격품\n   - 「수산생물질병관리법」 제17조제2항, 제18조, 제25조제1항, 각 호 및 제34조제1항이 적용되는 수산동물의 사체, 오염된 시설 또는 물건, 수입금지물건 및 검역 불합격품\n   - 「동물보호법」 제69조제1항에 따른 동물장묘업의 허가를 받은 자가 설치·운영하는 동물 장묘시설에서 처리되는 동물의 사체\n ◦ 의료폐기물 발생기관에서 발생한 액상(고형물 함량 15%미만) 의료폐기물을 수질오염방지시설(「물환경보전법」 제2조제12호)로 직접 유입·처리 가능하고, 그 배출시설의 설치허가권자 또는 신고수리권자가 그 처리를 인정하는 경우(「폐관법 시행규칙」제10조) ⇨ 직접 처리 가능(지자체 허가 必)\n ◦ 의료폐기물 발생기관에서 발생하는 폐백신, 폐항암제, 폐화학치료제가 아닌 의약품 ⇨ 사업장일반폐기물(폐의약품류, 51-42-00)\n ◦ 「의료법」제4조에 따른 일회용 의료기기가 아닌 재사용 가능한 의료기기", "chapter": "3장 · 분리배출 방법"}, {"code": "3.3", "title": "폐기물 유형별 분리배출 방법", "body": " ◇ 환자 특성(감염병/감염병의사/병원체보유 여부), 위해성 및 의료폐기물과 접촉 여부, 현장 의료진 판단 등 종합적인 고려 필요\n□ 의료기기\n ◦ 일회용 의료기기(「의료법」제4조에 따른 일회용 의료기기)\n   - 생물·화학폐기물 또는 혈액·체액 등을 포함하는 경우 ⇨ 의료폐기물\n   - 그렇지 않은 경우(미사용 기기를 폐기하는 경우 등) ⇨ 사업장폐기물\n ◦ 재사용 가능한 의료기기 세척에 사용된 솜·거즈\n   - 혈액, 체액, 조직물 등이 묻은 경우 ⇨ 의료폐기물\n   - 그렇지 않은 경우 → 사업장폐기물\n   ※ 세척수: 의료폐기물(액상)이 아닌 폐수 해당(의료폐기물로도 처리 가능)\n ◦ 조직물이 아닌 의료기기(고정 나사, 석고, 보형물, 치과 가공·주조용 합금 등)\n   - 세척이 가능한 경우 ⇨ 세척한 후 사업장폐기물 처리도 가능하나,세척하지 않고 의료폐기물로 처리 가능\n   - 세척이 불가능한 경우 ⇨ 의료폐기물\n□ 포장용기(약제실, 주사준비실, 수술실, 병동 스테이션 등)\n ◦ 포장용기, 사용설명서 등\n   - 혈액, 의약품, 생물·화학폐기물 등과 직접 닿지 않은 포장지, 사용설명서 등은 재질에 따라 분리배출(종이, 플라스틱, 비닐 등 ⇨ 재활용 가능)\n   - 알콜솜·스왑 보관 용기(플라스틱, 비닐 등 ⇨ 재활용 가능)\n□ 폐의약품\n ◦ 사용하고 남은 폐백신, 항암치료에 사용하고 남은 폐항암제·폐화학치료제, 그리고 폐백신·폐항암제·폐화학치료제와 접촉한 주사기, 수액백 등 ⇨ 의료폐기물(생물·화학폐기물)\n     ※ 생물·화학폐기물의 분류 참고사항(참고3)\n ◦ 폐백신, 폐항암제, 폐화학치료제 外 폐의약품 ⇨ 사업장일반폐기물\n□ 수액백, 수액줄, 앰플, 바이알 등\n ◦ 생물·화학폐기물 또는 혈액 등과 혼합·접촉하지 않은 경우 ⇨ 사업장일반폐기물\n   - 내용물을 비우고(사업장일반폐기물 폐의약품 또는 수질오염방지시설로 직유입 등) 세척 후 분리배출(재활용 가능)\n      ※ 앰플·바이알 등이 깨졌다 하더라도 의료폐기물에 해당하지 않음\n   - 약솜·거즈·필름류 등 재활용 불가능한 경우 ⇨ 사업장일반폐기물\n□ 채혈실 및 병리검사실 등에서 사용된 용품\n ◦ 혈액이 담긴 검사튜브 ⇨ 조직물류폐기물\n ◦ 채혈 후 사용된 채혈솜 ⇨ 일반의료폐기물\n ◦ 혈액이 포함된 병리검사에 사용된 폐기물 ⇨ 특성에 따라 손상성폐기물, 병리계폐기물, 일반의료폐기물 등으로 배출\n ◦ 기기분석에 사용되는 유기용매 등 단순 시약병은 의료폐기물 아님\n□ 보호구, 환자복, 침구류 등\n ◦ (1회용품) 사용한 경우 ⇨ 의료폐기물\n ◦ (1회용품) 사용 안 한 경우 ⇨ 사업장일반폐기물\n ◦ (다회용품) 세탁 후 재사용 가능     ※「의료기관 세탁물관리규칙」참고\n ◦ (다회용품) 오염이 심하여 사용 후 바로 폐기할 경우 ⇨ 의료폐기물\n ◦ (다회용품) 세탁 후 바로 폐기할 경우 ⇨ 사업장일반폐기물\n□ 일회용 기저귀\n   ※ 의료진이 감염·전염여부 및 위해성을 종합적으로 고려하여 분리배출 가능\n ◦ 격리환자의 의료행위에서 발생한 기저귀 ⇨ 격리의료폐기물\n ◦ 의료폐기물과 접촉한 기저귀 ⇨ 접촉한 의료폐기물과 동일한 의료폐기물\n ◦ 혈액 함유 기저귀 ⇨ 일반의료폐기물\n ◦ 감염병/감염병의사/병원체보유 환자가 사용한 기저귀 ⇨ 일반의료폐기물\n ◦ 그 외 환자가 사용한 기저귀 ⇨ 사업장일반폐기물(의료기관 일회용기저귀)\n   ※ (기존)‘그 밖의 폐섬유(51-27-99)’에서 ‘의료기관 일회용기저귀(51-27-04)’로 코드 변경(’23.12∼)\n   - 다만, 혈액이 함유되었을 것으로 추정되거나 또는 감염병유사환자가 사용한 것으로 의심되는 경우, 의료폐기물로 처리 가능\n•일반 비닐봉투로 개별 밀폐 포장 후 일회용기저귀 전용봉투에 담아 배출\n•의료기관 일회용기저귀는 생활폐기물(종량제봉투)로 배출 불가\n•의료폐기물이 아니기에, 의료폐기물 전용용기 및 RFID 사용 금지\n(일회용기저귀 배출 및 처리에 대한 업무처리 지침 참고)\n ◦ 환자의 보호자 또는 내원객이 사용한 기저귀 ⇨ 사업장일반폐기물\n ◦ (동물병원) 의료행위에서 발생한 기저귀 ⇨ 의료폐기물\n ◦ (동물병원) 건강한 동물의 단순 기저귀 ⇨ 사업장일반폐기물\n□ 외래환자, 입원환자, 격리환자(격리병동) 등이 배출하는 생활계폐기물\n ◦ 입원생활용품, 음식물쓰레기 등 ⇨ 의료폐기물과 접촉하지 않은 경우에 사업장일반폐기물\n ◦ 단, 의료기관의 세탁물관리규칙(보건복지부)과 폐기물관리법 시행규칙에 따라 의료진의 판단하에 의료폐기물로 배출 가능\n     ※ 접촉주의 등을 통한 의료기관내 감염에 주의(의료관련감염 표준예방지침, 2017 참조)", "chapter": "3장 · 분리배출 방법"}, {"code": "3.4-공통", "title": "배출원별: 공통사항", "body": "□ 공통사항\n ◦ 다음의 항목(인화성, 폭발성)들은 의료폐기물로 배출하지 아니하며, 세척 후 처리(세척에 사용한 탈지면, 거즈 등은 의료폐기물로 처리)\n   - 가스통 ⇨ 가스 배출 후 용기 재활용 또는 사업장일반폐기물 처리\n   - 건전지 ⇨ 폐건전지 수거함 활용하여 처리(지자체 문의)\n   - 단, 의료폐기물과 접촉한 액상 용매(포르말린, 톨루엔, 자일렌 및 알코올 등 용매) 등 세척이 불가능한 경우 ⇨ 액상 의료폐기물\n• 인화성 물질을 의료폐기물로 버릴 때에는 처리업체에 별도로 정보전달 필요(‘25.9~)\n  (「폐기물관리법」시행규칙 제22조제3호)\n - (수술실･병실) 조직물 보존액 등 인화성 물질을 사용하는 곳(예: 병리, 진단·검사, 수술실 등)은 의료폐기물 전용 용기에 담을 때 인화성 물질임을 표기하여 배출\n - (병·의원 의료폐기물 관리) △의료폐기물 보관시설에 유해성 정보자료 비치(MSDS 등), △수집·운반업체에 유해성 정보자료 전달\n 개선 전\n\n 개선 후\n ◦ 방사선 납 차폐복, 가운 등\n   - 혈액 오염 ⇨ 의료폐기물로 처리 또는 세척 후 지정/사업장일반 처리\n   - 납 함량이 0.3% 이상인 경우 ⇨ 지정폐기물(폐유독물질)로 처리\n   - 납 함량이 0.3% 미만인 경우 ⇨ 사업장일반폐기물로 처리\n   ※ 해당 폐기물이 「원자력안전법」에 따른 방사성물질과 이로 인하여 오염된 물질에 해당한다면 「폐기물관리법」에 적용받지 않으므로 의료폐기물 미해당", "chapter": "3장 · 분리배출 방법"}, {"code": "3.4-치과", "title": "배출원별: 치과의원·병원", "body": "□ 치과의원·병원\n ◦ 혈액, 분비물 등을 석션기로 흡입한 액상폐기물 ⇨ 의료폐기물(액상)\n    ※ 다량의 물로 세척하는 과정에서 나온 경우 의료폐기물 미해당\n ◦ 환자 구강 내 혈액, 분비물을 닦은 탈지면, 의료기기에 묻은 혈액을 닦은 탈지면 등 ⇨ 일반의료폐기물\n ◦ 혈액·조직물이 붙어있는 사용한 의료기기(아말감, 합금, 골이식재 등)\n   - 세척이 가능한 경우 ⇨ 세척한 후 사업장폐기물 처리도 가능하나,세척하지 않고 의료폐기물로 처리 가능\n   - 세척이 불가능한 경우 ⇨ 의료폐기물\n      ※ 사용하지 않은 수은 원액 또는 아말감 키트는 의료폐기물 아님\n ◦ 발치한 치아는 의료폐기물(조직물류)이나, 치아로부터 완전히 분리되어 세척된 의료기기(아말감, 합금, 골이식재 등)는 의료폐기물 아님\n   ※ 인체 조직물(사체, 태반, 지방, 치아 등)의 경우 본인이 요구하면 본인에게 인도 가능하나, 반드시 묘지에 묻거나 화장하여야 하며 인도한 자는 기록을 3년간 보존하여야 함\n   ※ 인체유래물이 아닌 소재의 의료기기는 인체 조직물에 해당하지 않음", "chapter": "3장 · 분리배출 방법"}, {"code": "3.4-한의원", "title": "배출원별: 한의원·한방병원", "body": "□ 한의원·한방병원\n ◦ 사용한 한방침 ⇨ 의료폐기물[손상성 또는 일반의료(보호캡 있는 경우)]\n ◦ 미사용, 폐기 예정 한방침 ⇨ 사업장일반폐기물\n ◦ 치료 후 혈액 등이 묻은 탈지면, 솜 등 ⇨ 일반의료폐기물", "chapter": "3장 · 분리배출 방법"}, {"code": "3.4-동물병원", "title": "배출원별: 동물병원", "body": "□ 동물병원\n ◦ 의료행위에서 발생한 조직물, 배설물 기저귀, 패드 ⇨ 의료폐기물\n ◦ 건강한 동물의 단순 배설물 기저귀, 패드 ⇨ 사업장일반폐기물\n ◦ 이미용 과정에서 발생한 털, 발톱 등 ⇨ 사업장일반폐기물", "chapter": "3장 · 분리배출 방법"}, {"code": "3.4-조산원", "title": "배출원별: 조산원·부인과·신생아실", "body": "□ 조산원, 부인과, 신생아실\n ◦ 입원환자 또는 의료행위에서 발생한 기저귀, 패드, 생리대 등 ⇨ 의료폐기물\n   - 격리환자의 의료행위 또는 혈액이 함유되었다고 판단되는 경우  의료폐기물로 배출·처리\n   - 의료폐기물이 아닌 폐기물로서 의료폐기물과 혼합되거나 접촉된 폐기물은 의료폐기물로 배출·처리\n ◦ 일반 배설물 기저귀 ⇨ 사업장일반폐기물(의료기관 일회용기저귀)\n   ※ (기존)‘그 밖의 폐섬유(51-27-99)’에서 ‘의료기관 일회용기저귀(51-27-04)’로 코드 변경(’23.12∼)\n•일반 비닐봉투로 개별 밀폐 포장 후 일회용기저귀 전용봉투에 담아 배출\n•의료기관 일회용기저귀는 생활폐기물(종량제봉투)로 배출 불가\n•의료폐기물이 아니기에, 의료폐기물 전용용기 및 RFID 사용 금지\n(일회용기저귀 배출 및 처리에 대한 업무처리 지침 참고)\n   - 다만, 혈액이 함유되었을 것으로 추정되거나 또는 감염병유사환자가 사용한 것으로 의심되는 경우, 의료폐기물로 처리 가능\n      ※ 의료진이 감염·전염여부 및 위해성을 종합적으로 고려하여 분리배출 가능\n ◦ 태반은 의료폐기물 수집·운반업을 통해 소각시설 또는 재활용업체로만 인계가능하며, 개인 소장용으로 반출 불가\n   ※ 인체 조직물(사체, 태반, 지방, 치아 등)의 경우 본인이 요구하면 본인에게 인도 가능하나, 반드시 묘지에 묻거나 화장하여야 하며 인도한 자는 기록을 3년간 보존하여야 함", "chapter": "3장 · 분리배출 방법"}, {"code": "3.4-주사투석", "title": "배출원별: 주사, 투석", "body": "□ 주사, 투석\n ◦ 사용한 일회용 주사기, 카테터 등\n   - 바늘이 분리 가능한 경우 바늘은 손상성폐기물, 본체는 상황에 따라   ⇨ 생물·화학폐기물 또는 일반의료폐기물\n   - 바늘 분리가 불가능한 일체형의 경우 ⇨ 손상성폐기물\n   - 단, 보호 뚜껑이 있는 경우 ⇨ 일반의료폐기물로도 처리 가능\n ◦ 혈액투석에 사용되었거나 혈액이 유출될 정도의 폐기물 ⇨ 혈액오염폐기물\n ◦ 미사용* 주사기, 카테터 등을 폐기하는 경우 ⇨ 사업장일반폐기물\n   * 개봉을 하지 않고, 어떤 목적으로든 사용자체가 되지 않은 주사기 등을 의미(환자에게 직접 사용하지 않았으나, 믹스용 또는 수액줄에 투약시 사용한 주사기 등은 미해당)\n ◦ 환자랑 접촉하지 않고 투석 후 혈액이 섞이지 않고 탄산수소나트륨 등 가루가 남아있는 용기, 관(튜브) 등 ⇨ 사업장일반폐기물", "chapter": "3장 · 분리배출 방법"}, {"code": "3.4-건강검진", "title": "배출원별: 건강검진센터", "body": "□ 건강검진센터\n ◦ 건강검진에 사용된 일회용품\n   - 종류: 폐활량 측정용 필터 및 일체형 마우스피스, 소변컵, 슬리퍼, 가운, 턱받침, 안구검사용 일회용 종이(턱) 및 눈가리개, 내시경용 마우스피스, 질경, 혈액·체액이 묻지 않은 니들 홀더, 설압자 등\n   - 감염병/감염병의사/병원체보유 환자가 사용한 경우 ⇨ 의료폐기물\n   - 그 외 일반 건강검진자가 사용한 용품 ⇨ 사업장일반폐기물\n ◦ (내시경) 혈액·체액 등이 묻은 패드, 장갑 등 ⇨ 일반의료폐기물\n ◦ (내시경) 혈액·체액 등이 묻지 않은 경우 ⇨ 사업장일반폐기물\n ◦ (채혈) 혈액이 담긴 검사튜브 ⇨ 조직물류폐기물\n ◦ (채혈) 채혈 후 사용된 채혈솜 또는 밴드 ⇨ 일반의료폐기물", "chapter": "3장 · 분리배출 방법"}, {"code": "3.4-공용시설", "title": "배출원별: 로비·복도·화장실·주차장 등", "body": "□ 병원 내 로비, 복도, 화장실, 주차장 등\n ◦ 의료폐기물 발생지역이 아니므로 전용용기 비치 자제 권고\n ◦ 다만, 채혈솜·밴드 등이 로비, 복도, 화장실 등에서도 배출될 수 있는 점을 고려하여\n   - 채혈실 인근 구역(로비, 복도, 화장실)을 ‘(가칭)의료폐기물 free zone’으로 설정하고 채혈실, 건강검진 구역에서만 버릴 수 있게 유도\n•(일본 사례) 로비 내 위치한 채혈실 외부에 채혈 완료 후 대기장소 설정, 지혈완료시까지 이동 통제 → 약솜 회수. 단, 로비 및 복도 등에 의료폐기물 수거용기 비치하지 않음\n   - 또는 채혈솜·밴드만 버릴 수 있는 전용용기함 제작·비치\n ◦ 불가피하게 일반폐기물 쓰레기통과 의료폐기물 전용 용기를 동시에 설치할 경우, 안내판을 부착하여 일반폐기물과 의료폐기물 분리 배출 유도\n ◦ 일반폐기물 쓰레기통에서 채혈솜 등의 의료폐기물 발견된 경우 접촉된 주변 부분만 재수거하여 의료폐기물 전용용기로 이동\n채혈실 앞 의료폐기물 전용용기에 혼합된 일반폐기물 사례\n채혈실 주변 일반폐기물 쓰레기통에 배출된 의료폐기물(채혈솜) 사례", "chapter": "3장 · 분리배출 방법"}, {"code": "3.4-멸균분쇄", "title": "배출원별: 멸균분쇄시설 설치·운영", "body": "□ 멸균분쇄시설을 설치·운영하는 경우\n ◦ 멸균분쇄시설은 의료폐기물 배출자만 자가처리를 위해 설치·운영 가능\n ◦ 멸균분쇄시설에 넣기 전에 전용용기를 해체하여서는 아니되며 전용용기에 담은 상태 그대로 넣어야 함\n ◦ 멸균분쇄가 불가능한 의료폐기물 종류\n   - 액상 의료폐기물\n   - 격리의료폐기물, 조직물류폐기물, 생물·화학폐기물\n   - 보관·운반 과정에서 혈액, 체액, 분비물, 배설물 등이 흘러내릴 수 있는 물질을 포함한 의료폐기물\n   - 폐기물중간처분업자 또는 최종처분업자가 처분하는 의료폐기물\n ◦ 사업장 내에서 멸균분쇄시설까지 의료폐기물 운반 방법\n   - 의료폐기물을 넣은 봉투형 전용용기는 반드시 전용 운반구(뚜껑이 있고 견고할 것)를 사용하여 멸균분쇄시설까지 이동하여야 하며, 사용한 전용 운반구는 「감염병예방법 시행규칙」 별표6 제2호라목에 따른 약물소독 실시\n     ※ 상자형(골판지, 합성수지) 전용용기의 경우 밀봉한 후 뚜껑이 없는 전용 운반구를 사용하여 이동 가능\n     ※ 동일 부지 내에서만 이동 가능(사업자가 동일하더라도 도로, 횡단보도 등으로 구분되거나 주소지가 서로 다른 부지일 경우 이동 불가)\n     ※ 소독약품의 종류는 「생활화학제품 및 살생물제의 안전관리에 관한 법률」에 따라 기후에너지환경부장관의 승인을 받은 제품 사용\n ◦ 멸균분쇄시설은 의료폐기물을 재사용할 수 없도록 분쇄하여야 하며, 검사 결과 멸균되지 아니한 경우에는 재처분(멸균)하여야 함\n ◦ 멸균분쇄한 잔재물은 ‘의료폐기물 멸균분쇄잔재물(51-46-00)’을 영업대상폐기물로 하는 사업장일반소각장에서 소각 처리, 소각잔재물은 매립 처리", "chapter": "3장 · 분리배출 방법"}, {"code": "참고2-1", "title": "참고2-1 배출자 인증 비콘태그", "body": "□ 배출자 인증 비콘태그\n ○ (정의) 배출자가 의료폐기물을 수집·운반업체에 인계할 시 배출자의 서명을 대신하는 인증용 태그 장치\n   ※ (법적근거) 「폐기물관리법」 제18조제3항 및 제45조제2항, 「무선주파수인식방법을 이용한 의료폐기물의 인계・인수 등에 관한 고시」 제8조제2항제3호\n ○ (도입목적) 배출자와 운반자 간 의료폐기물 인계․인수 시 배출자 인증방식을 개선*하여 허위 인계서 등록을 차단하기 위해 도입\n    * (기존) 배출자 인증카드(휴대용) → (변경) 비콘태그(고정부착형)\n ○ (적용대상) 의료폐기물 배출자(고정형 배출자 입·출고 시스템을 설치 배출자는 제외)\n ○ (시행일) 2022. 10. 1. 부터\n   ※ 비콘태그를 이용한 배출자 인증방식의 안정적인 정착을 위해 배출자 인증카드 병행 사용 허용(환경부, ’22.10.1.~’23.3.31.)\n<비콘태그를 이용한 배출자 인증 절차>\n   ※ 구매 및 설치 방법은, ‘의료폐기물의 안전한 관리 및 처리를 위한 지침’ 참고", "chapter": "참고 · 인계인수 및 생물화학분류"}, {"code": "참고2-2", "title": "참고2-2 배출자 준수사항(전자태그·비콘태그·고정형 입출고시스템)", "body": "□ 배출자 준수사항\n<공통 사항>\n ○ 의료폐기물을 처리하려는 자는「폐기물관리법」제17조제5항에 따라 폐기물처리계획서를 확인받아야 하며, 확인필증은 배출자가 보관\n   -「의료법」제3조제2항제3호마목의 종합병원은 관할 유역‧지방환경청에 제출, 그 밖의 배출 기관은 관할 지자체에 제출\n   - 폐업, 업종변경 등으로 더 이상 의료폐기물을 배출하지 않는 경우, 폐기물처리계획서 확인필증을 승인기관에 반납\n     ※ 반납필증을 받은 후 한국환경공단(032-590-4277 또는 4278)로 연락하여 계정 비활성화 필요\n ○ 같은 법 제17조제6항에 따라 상호, 사업장 소재지, 폐기물 종류 및 양, 처리방법 또는 처리자, 공동 처리하는 사업장의 수 등을 변경하고자 할 경우에는 변경확인을 받아야 함\n ○ 승인기관으로부터 폐기물처리(변경)계획 확인필증을 받은 후 즉시 올바로시스템에 해당 내용을 반영하여야 함\n   ※ 배출자의 올바로시스템 계정(아이디, 비밀번호)은 반드시 배출자가 직접 관리할 것\n<전자태그 사용 시 주의사항>\n ○ 전용용기 1개당 전자태그를 1개 부착하여 의료폐기물을 배출하여야 함\n   - 소형 전용용기 각각에 태그가 부착된 경우에는 운반 편의를 위해 태그가 부착되지 않은 마대 등에 담아 운반할 수 있음\n   - 태그가 부착되지 않은 소형 전용용기를 모아 대형 전용용기에 담아 배출할 때에는 대형 전용용기에만 태그 1개를 부착하여 배출\n ○ 액상폐기물은 태그 미인식 방지를 위하여 전용용기 뚜껑 상단 등 액체의 간섭이 없는 곳에 태그 부착\n ○ 전용용기 안에 미사용 또는 폐기대상 태그 등을 투기하는 행위 금지\n<비콘태그 관련>\n ○ 비콘태그는 반드시 올바로시스템을 통해서 구입하여야 함\n ○ 작동 여부를 확인하고 반드시 벽에 붙인 상태로 사용하여야 함\n ○ 비콘태그 설치 및 초기화 시 제품별(판매사별) 매뉴얼 확인 후 진행\n   ※ 초기화 프로그램은 윈도우 10 이상 환경에서 사용하는 것을 권장\n ○ 비콘태그 배터리 교체 시에는 원형 배터리(CR2450)를 1개씩 순차적으로 교체(2개 동시 제거 시 초기화 작업 필요)\n   ※ 방전으로 인한 초기화 작업 등 불편 방지를 위해 상시 전원 공급 권장\n< 대체입력 사유 >\n•장비 개선ㆍ변경ㆍ점검 및 보수가 필요한 경우\n•천재지변이나 화재, 돌발적 사고 및 그 밖의 불가항력적인 사유로 장비의 정상적인 작동이 불가능한 경우\n•의료폐기물의 안전하고 효율적 처리를 위해 필요하다고 환경부장관이 인정하는 경우\n<고정형 배출자 입·출고 시스템 관련>\n ○ 전자태그는 고정형 시스템과 멀리 떨어진 곳에서 보관하고, 가급적 배출 전에 부착하여 전자태그로 인한 오류 발생 방지\n ○ 배출자가 고정형 시스템을 보관창고에 설치할 경우 보관창고의 출입문 구조 등이 무선주파수 인식에 적합하도록 조치\n   ※ 보관창고에 적재된 폐기물(태그)과 RFID 안테나는 충분한 이격거리를 유지하여야 하며, 인식범위 조정 등을 통해 오류가 발생하지 않도록 해야 함\n ○ 보관창고 적재 전 입고처리 완료 여부, 수집‧운반업체 인계‧인수 전 출고처리 완료 여부, 출고된 폐기물 정보와 실제 배출 물량의 수량 일치 여부를 반드시 확인\n<고정형 배출자 입·출고 시스템 적정 사용 환경 관리 사례>\n전용 보관창고\n(종합병원 내 부지에 독립하여 관리)\n 태그 보관함\n(미사용 태그가 리더기에 읽히는 것을 방지하기 위해 이격 보관)\n의료폐기물 입고 시스템\n(불필요한 태그인식 방지)\n입고 작업 중\n (폐기물 종류·수량에 맞는 전자태그 재확인 절차 포함)\n입고 작업 완료\n(계수기로 물량 이중 확인)\n의료폐기물 출고 시스템\n(불필요한 태그인식 방지)\n출고 리더기 방향\n(정확한 인식 위한 조치)\n출고 작업\n(계수기로 물량 이중 확인)\n ※ (대전) 충남대학교 병원 협조", "chapter": "참고 · 인계인수 및 생물화학분류"}, {"code": "참고3", "title": "생물·화학폐기물의 분류(폐백신·폐항암제·폐화학치료제)", "body": "생물·화학폐기물의 분류 참고사항\n  폐백신, 폐항암제, 폐화학치료제의 분류시 사용 용도, 유효성분, 인체 및 환경 위해성 등을 고려하고 국내외 통용되는 ATC코드를 참조하여 구분 가능\n  ※ 동 내용은 참고용이며 복합성분 등 의약품 특성에 따라 다를 수 있음\n   ※ 향후 ‘의약품분류번호와 WHO-ATC 분류코드 비교 연구(식약처,’26)에 따라 현장 적용성을 높이는 분류체계로 보완·변경 예정(‘27~)\n    - ATC코드는 ’의약품관리종합정보포털‘(보건복지부 건강보험심사평가원) 에서 참조\n  ○ (폐백신) 감염성 질환의 예방을 목적으로 사람이나 동물에게 투여하여 특정 병원체에 대한 면역반응을 유도하는 항원(생균, 사균, 독소, 재조합 단백질, 핵산/mRNA 등)을 주성분으로 하는 의약품 폐기물\n   - (분류참조) ATC코드 ’J07‘ 등의 의약품 가운데 폐백신으로 분류할 수 있는 폐의약품\n   - (대표성분예시) 독감, B형간염, COVID-19, BCG, MMR 등 국가예방 접종 및 일반 백신 일체\n  ○ (폐항암제) 고전적 세포독성 항암제 뿐만 아니라 표적치료제, 항체·면역기반 및 호르몬 기반 항암제를 모두 포함\n   - (분류참조) ATC코드 ’L01‘, ’L02‘ 등의 의약품 가운데 폐항암제로 분류할 수 있는 폐의약품\n   - (대표성분예시) 세포독성·표적·면역항암제 전체(시스플라틴, 파클리탁셀 등), 호르몬성 항암제, 표적치료제 등\n  ○ (폐화학치료제) 비(非)세포독성 화학요법제(항균, 항바이러스, 항원충제(기생충)등)로서, 암 치료에 쓰이는 세포독성 항암제를 제외한 감염병 치료 및 기타 화학요법에 사용 후 폐기되는 의약품\n      ※ 직접적인 세포독성은 낮으나, 환경 유출 시 생태계 독성 및 내성균 문제를 유발할 수 있어 관리가 필요한 항생물질군 폐기물을 의미\n   - (분류참조) ATC코드 ’J01‘, ’J02‘, ’J04‘, ’J05‘ 등의 의약품 가운데 폐화학 치료제로 분류할 수 있는 폐의약품\n   - (대표성분예시) 항병원생물성 의약품(항생제) 전체, 화학요법제(외용항생제 및 항바이러스제 등 포함)", "chapter": "참고 · 인계인수 및 생물화학분류"}], "flat_qas": [{"id": "①-1", "cat": "배출기관·장소", "catFull": "① 의료폐기물 배출기관 및 배출장소 관련", "intro": "◇ 법에서 정한 배출기관에서 배출되는 경우에만 의료폐기물\n\n ◇ 배출기관이 아니라면, 의료폐기물과 유사하더라도 非의료폐기물", "q": "가정에서 사용한 일회용 주사기는 의료폐기물인지?", "a": "의료폐기물은 「폐기물관리법 시행규칙」[별표3]에서 규정한 의료폐기물 발생기관에서 배출된 것으로서, 가정에서 배출되는 일회용 주사기 등은 의료폐기물에 해당하지 않습니다."}, {"id": "①-2", "cat": "배출기관·장소", "catFull": "① 의료폐기물 배출기관 및 배출장소 관련", "intro": "◇ 법에서 정한 배출기관에서 배출되는 경우에만 의료폐기물\n\n ◇ 배출기관이 아니라면, 의료폐기물과 유사하더라도 非의료폐기물", "q": "사업장 내 부속의료기관이 아닌 건강지원실을 운영하고 있는데, 건강지원실 운영 중에 나오는 소량의 의료폐기물은 어떻게 처리해야 하는지? / 마트 식품판매코너에서 현장형 미생물 검사를 계획중인데, 검사에 사용한 배지, 검사 키트는 어떤 폐기물로 분류되는지? / LMO고등학교 지정을 위해, LMO 실험 후 나오는 폐기물을 의료폐기물로 처리하고 싶은데 가능한지? / 저희 기관은 사업장 보건관리를 수행하는 기관으로 혈당 측정 과정에서 솜과 채혈침이 소량 발생하며 그 외의 폐기물은 나오지 않습니다. 의료폐기물 처리가 가능한지? / 본사는 건강기능식품을 제조하는 업소인데, 제품에 대한 병원성 미생물 검사에서 나오는 폐기물을 의료폐기물로 처리가 가능한지? / 학교보건법에 따른 행위로 보건교사가 학생 및 교직원의 건강관리 업무 중 상처치료로 발생한 폐기물이 의료폐기물인지? / 복지관에서 근무 중인데, 복지관에서 혈당 체크 중 나오는 솜과 바늘이 의료폐기물인지? / 하수처리장을 운영 중에 총대장균군 폐배지가 발생합니다. 의료폐기물에 해당하는지? / 식품내 병원성 미생물 분석을 하고 있는데, 배지 및 패트리디쉬 등이 의료폐기물에 해당하는지? / 직업체험 기관인데, 의료실습기기 사용 후에 나오는 주사바늘 등이 의료폐기물에 해당하는지? / 의료기기 제조업체입니다. 뼈, 피부 등을 이용하여 의료기기 제조시 발생하는 폐조직은 의료폐기물에 해당하는지? / 노인장기요양보험법에 따른 복지센터를 운영중인데, 진료  발생한 솜, 바늘 등이 의료폐기물에 해당하는지?", "a": "의료폐기물은 「폐기물관리법 시행규칙」[별표3]에서 규정한 의료폐기물 발생기관에서 배출된 것으로서, 해당 기관이 의료기관 및 시험·검사기관에 해당하지 않는다면 해당 장소에서 발생한 폐기물은 의료폐기물이 아닌 생활폐기물 또는 사업장폐기물로 분류됩니다. 처리방법 등 자세한 사항은 관할 지자체를 통해 확인하시면 됩니다."}, {"id": "①-3", "cat": "배출기관·장소", "catFull": "① 의료폐기물 배출기관 및 배출장소 관련", "intro": "◇ 법에서 정한 배출기관에서 배출되는 경우에만 의료폐기물\n\n ◇ 배출기관이 아니라면, 의료폐기물과 유사하더라도 非의료폐기물", "q": "저희 기관은 LMO 1등급, 2등급 실험실이 존재하는 기관인데, 실험 중에 발생한 폐기물을 멸균할 경우 의료폐기물이 아닌 폐기물에 해당하는지?", "a": "의료폐기물은 「폐기물관리법 시행규칙」[별표3]에서 규정한 의료폐기물 발생기관에서 배출된 것으로서, 해당 기관이 의료기관 및 시험·검사기관에 해당하지 않는다면 해당 장소에서 발생한 폐기물은 의료폐기물이 아닌 생활폐기물 또는 사업장폐기물로 분류됩니다. 의료폐기물 배출기관에서 발생한 의료폐기물을 멸균하더라도 의료폐기물의 지위를 상실하지 않습니다. 즉 멸균하여도 의료폐기물로 처리하여야 합니다."}, {"id": "①-4", "cat": "배출기관·장소", "catFull": "① 의료폐기물 배출기관 및 배출장소 관련", "intro": "◇ 법에서 정한 배출기관에서 배출되는 경우에만 의료폐기물\n\n ◇ 배출기관이 아니라면, 의료폐기물과 유사하더라도 非의료폐기물", "q": "동물병원 수의사가 출장방문하여 축산농가에서 동물 조직물이 발생한 경우, 폐백신병 및 사용한 주사기가 의료폐기물에 해당되는지?", "a": "의료폐기물은 「폐기물관리법 시행규칙」별표3의 의료폐기물 발생 의료기관 및 시험․검사기관 등에서 발생되는 것으로 한정됩니다.\n - 따라서, 의료폐기물 발생기관에 해당하지 않는 축산농가에서 발생되는 폐기물은 의료폐기물에 해당하지 않으며, 축산농가의 배출시설 유무 및 폐기물 발생량 등에 따라 사업장일반폐기물 또는 생활폐기물로 분류될 수 있습니다.\n - 다만, 지자체 조례에 따라 생활계유해폐기물 등으로도 분류, 수거할 수 있습니다."}, {"id": "①-5", "cat": "배출기관·장소", "catFull": "① 의료폐기물 배출기관 및 배출장소 관련", "intro": "◇ 법에서 정한 배출기관에서 배출되는 경우에만 의료폐기물\n\n ◇ 배출기관이 아니라면, 의료폐기물과 유사하더라도 非의료폐기물", "q": "병실 내 화장실에서 발생한 배설물 및 혈액이 묻은 휴지는 의료폐기물인지?", "a": "의료행위와 무관하게 병실 내 화장실에서 일반적인 용변 후 발생한 휴지는 의료폐기물에 해당하지 않습니다. 참고로, 용변과 혼합된 휴지는 「하수도법」상 하수에 해당하며, 「폐기물관리법」은 하수와 분뇨에 대해 적용하지 않습니다."}, {"id": "➁-1", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "의료기관 내에서 의료행위가 아닌 미용의 의미로 이미용을 했을 경우 머리카락은 의료폐기물인지?", "a": "의료행위와 무관하게 이미용 목적으로 발생한 머리카락은 의료폐기물에 해당하지 않을 것으로 사료됩니다."}, {"id": "➁-2", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "동물병원에서 발생하는 건강한 동물의 배설물 제거용으로 사용된 일회용 기저귀, 패드, 휴지 등은 의료폐기물인지?", "a": "동물병원에서 건강한 동물의 배설물 제거용으로 사용된 일회용 기저귀, 패드, 휴지 등은 의료폐기물에 해당되지 않으나, 진료․처치 등 의료행위에 의해 발생되는 배설물이 함유된 일회용기저귀 등은 의료폐기물로 처리하여야 할 것입니다."}, {"id": "➁-3", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "복막투석 후 배액은 어떻게 배출해야 하나요?", "a": "복막투석 후 배액은 의료행위(투석)에 사용된 폐기물로 판단되므로, 혈액오염폐기물(액상)으로 의료폐기물 합성수지 전용용기에 담아 배출하면 됩니다."}, {"id": "➁-4", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "환자가 흘리는 땀도 일반의료폐기물 중 분비물에 포함되나요?", "a": "분비물이란 인체 분비샘에서 나오는 물질을 말하며, 의료행위 과정에서 발생 한 경우 의료폐기물에 해당합니다."}, {"id": "➁-5", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "입원환자의 가래, 콧물 등이 의료폐기물인지?", "a": "의료행위와 무관한 경우 의료폐기물에 해당하지 않을 수 있으나, 질환의 특성, 감염 경로, 전파 특성 등에 따라 의료진이 판단하에 의료폐기물로 배출 가능합니다. 의료행위 과정에서 발생한 가래, 콧물 자체는 의료폐기물에 해당합니다."}, {"id": "➁-6", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "재활치료실에서 간섭파 치료기 컵 부착면을 닦은 알콜솜은 의료폐기물인가요?", "a": "치료기 컵 부착면에 환자의 혈액, 체액, 분비물등이 묻어있지 않고, 닦은 알콜솜이 의료폐기물과 접촉되지 않았다면 의료폐기물에 해당하지 않습니다."}, {"id": "➁-7", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "동물병원에서 배출하는 표본보존용 포르말린을 배출시 어떻게 배출해야 하나요?", "a": "동물사체 등 조직물류폐기물(의료폐기물)과 혼합 및 접촉한 포르말린은 의료폐기물로 처리하여야 할 것으로 사료됩니다. 더하여 인화성, 폭발성 용매를 포함한 의료폐기물은 인계·인수 과정에서 명확히 전달하여야 합니다."}, {"id": "➁-8", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "환자와 접촉하지 않은 잔량의 조영제는 의료폐기물에 해당하지 않는데, 그 조영제의 용기인 “병” 또한 의료폐기물에 해당하지 않는지?", "a": "환자와 접촉하지 않은 조영제 및 그 조영제 용기 또한 의료폐기물에 해당하지 않습니다."}, {"id": "➁-9", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "연구소에서 방사면역진단 검사로 발생한 폐수에 방사성동위원소가 포함되어 있지만 원자력안전법 배출관리기준 이하입니다. 이 경우 의료폐기물에 해당하는지?", "a": "해당 연구소가 의료폐기물 배출기관에 해당한다면, 해당 혈청 등을 포함한 폐기물은 의료폐기물(액상)에 해당합니다. 다만, 액상의 폐기물은 「물환경보전법」 제2조제12호에 따른 수질오염방지시설에 직접 유입하여 처리하는 경우 그 배출시설의 설치허가권자 또는 신고수리권자가 그 처리를 인정하는 경우 해당 시설을 통해 처리할 수 있습니다.\n   반면, 해당 폐기물이 「원자력안전법」에 따른 방사성물질과 이로 인하여 오염된 물질에 해당한다면 「폐기물관리법」에 적용받지 않아 의료폐기물에 해당하지 않습니다."}, {"id": "➁-10", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "사용한 주사기와 주사침을 분리하지 않은채 손상성폐기물로 배출하여도 되는지?", "a": "주사바늘 등은 손상성폐기물로 분류됩니다. 따라서 주사바늘등과 분리되지 않은 주사기는 인체 및 전용용기에 손상을 줄 우려가 있어 손상성폐기물로 분류되어야 할 것입니다."}, {"id": "➁-11", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "생물·화학폐기물 또는 혈액 등과 접촉하지 않은 경우, 환자에 직접 접촉하지 않은  경우라면 바늘을 제거한 주사기, 수액백 등을 사업장일반폐기물로 배출 가능한 지?", "a": "생물·화학폐기물(폐백신, 폐항암제, 폐화학치료제) 또는 혈액 등과 혼합·접촉하지 않은 경우 주사기 본체(주사바늘 제거), 수액백 등은 의료폐기물에 해당되지 않으며, 사업장일반폐기물로 분류할 수 있습니다.\n   또한, 환자에게 직접 사용하지 않고 믹스용 또는 수액줄에 투여한 주사기, 수액백 등도 마찬가지로 생물·화학폐기물 또는 혈액 등과 혼합·접촉하지 않은 경우 사업장일반폐기물로 분류할 수 있습니다."}, {"id": "➁-12", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "석션을 통해 배출된 객담에 피가 섞인 경우 어떻게 분류하여야 하는지?", "a": "혈액이 포함된 객담의 경우 조직물류폐기물(액상)에 해당합니다."}, {"id": "➁-13", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "외부 충격에 의해 인체 및 전용용기에 손상을 줄 우려가 있을 경우 손상성폐기물로 분류되어야 하는데, 실험에 사용한 병리계 폐기물의 경우 쉽게 파손될 우려가 있는 경우 어떻게 처리하여야 하는지?", "a": "실험에 사용한 슬라이드 등이 병리계폐기물 및 기타 의료폐기물이 인체 및 전용용기 손상을 줄 우려가 있는 경우 손상성폐기물로 분류할 수 있습니다."}, {"id": "➁-14", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "조직물류폐기물과 혈액오염폐기물은 혈액이라는 공통점이 있습니다. 이 둘의 차이를 구분하는 방법은?", "a": "「폐기물관리법 시행령」별표2에 따라 혈액, 고름 및 혈액생성물 등은 조직물류폐기물이며, 폐혈액백, 혈액 투석시 사용한 폐기물, 그 밖에 혈액이 유출될 정도로 포함되어 있는 폐기물은 혈액오염폐기물에 해당합니다. 또한 채혈진단에 사용된 혈액이 담긴 검사튜브 및 용기는 조직물류로 분류됩니다. 따라서 혈액이 흐를 정도로 담겨있는 경우는 조직물류 폐기물로 처리하는 것이 바람직 할 것입니다."}, {"id": "➁-15", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "혈액이 소량(10cc 미만) 주사기에 담겨있는 경우, 어떠한 전용용기를 사용하는지?", "a": "용기를 기울여서 흘러내릴 정도로 내용물이 함유되어 있는 경우에는 액상폐기물로 볼 수 있어, 합성수지류 상자형 용기에 관리하는 것이 바람직할 것입니다. 참고로, 수분함량이 85퍼센트를 초과하거나, 고형물 함량이 15퍼센트 미만인 경우 “액상”으로 분류됩니다."}, {"id": "➁-16", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "환자 접촉없이, 수술기구 소독에 사용하는 과산화수소, 포비딘요오드 용기는 어떻게 처리하여야 하는지?", "a": "과산화수소 및 포비딘요오드가 생물·화학폐기물 중 폐백신, 폐항암제 및 폐화학치료제에 해당하지 않고 의료폐기물과 접촉하지 않았다면 의료폐기물에 해당하지 않습니다. 그 용기 또한 의료폐기물에 해당하지 않습니다."}, {"id": "➁-17", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "의료기관에서 사용하고 남은, 또는 유통기간이 지난 손 소독제는 의료폐기물인지?", "a": "손 소독제와 용기를 포함한 제품의 경우 의료폐기물과 접촉하지 않았다면 의료폐기물에 해당하지 않습니다."}, {"id": "➁-18", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "응고된 혈액이 함유된 거즈는 어떠한 의료폐기물에 해당하는지?", "a": "혈액은 닦아낸 정도가 아닌 혈액이 응고될 정도로 포함된 경우, 조직물류 폐기물로 구분하여 배출하는 것이 바람직할 것입니다."}, {"id": "➁-19", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "내시경 전 기포 제거제로 가소콜이라는 액상 약을 마시는데, 환자들이 남긴 경우 의료폐기물에 해당하는지?", "a": "생물·화학폐기물(폐백신, 폐항암제, 폐화학치료제)에 해당하지 않거나, 의료폐기물과 접촉하지 않았다면 의료폐기물에 해당하지 않습니다."}, {"id": "➁-20", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "유리 제품으로 된 항생제의 경우 생물화학폐기물로 처리하는지 아니면 손상성폐기물로 처리하는지?", "a": "생물·화학폐기물(폐백신, 폐항암제, 폐화학치료제)에 해당하지 않는다면 그와 접촉한 유리제품 역시 의료폐기물에 해당하지 않습니다. 다만, 의료폐기물과 접촉하였다면 의료폐기물로 분류됩니다."}, {"id": "➁-21", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "x-ray 사진을 찍을때 사용하는 필름이나 수은 등이 포함된 혈압계, 온도계 등은 의료폐기물인지?", "a": "「폐기물관리법 시행령」[별표2]의 규정에 따라 x-ray 필름, 수은 함유 혈압계 등은 의료폐기물에 해당하지 않습니다.\n - 다만, 수은이 포함된 혈압계, 온도계 등은 수은함유폐기물(폐계측기기)로 분류되어 지정폐기물로 처리되어야 합니다."}, {"id": "➁-22", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "수술실에서 사용하는 손위생 솔과 아바가드용 nail cleaner(환자의 체액이나 분비물이 묻지 않았고 직원의 손위생에 사용한 물건)는 의료폐기물인지?", "a": "질의하신 폐기물이 수술 전 의료진의 위생을 위하여 사용되고, 환자의 진료에 직접적으로 사용되지 않는다면 의료폐기물에 해당되지 않습니다. 단, 환자의 혈액, 체액, 분비물 등이 묻어 있거나 접촉된 경우에는 의료폐기물로 배출하여야 합니다."}, {"id": "➁-23", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "경관급식환자 RTH 피딩 주입기 또는 완전비경구영양법에 사용하는 수액라인 등이 의료폐기물에 해당하는지?", "a": "환자의 혈액, 체액, 분비물 등이 묻은 경우 의료폐기물에 해당합니다."}, {"id": "➁-24", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "골절 환자의 뼈 고정에 사용하였던 금속나사, 금속판의 경우 치료 이후에 제거하게 되는데, 소독과정을 거친 후에도 의료폐기물에 해당하는지?", "a": "의료기기에 해당하는 금속나사 및 금속판 등을 세척·소독 한 경우 의료폐기물에 해당하지 않습니다. 다만 세척 및 소독에 사용한 약품 및 닦아낸 거즈 등은 의료폐기물에 해당하며, 세척수는 의료폐기물에 해당하지 않습니다. 의료기기 사용, 사후관리 및 양도와 관련된 구체적인 내용은 관할청(식약처)에 문의하시기 바랍니다."}, {"id": "➁-25", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "뇌수술할 경우 skull bone을 잘라 사용하고 향후 환자에게 사용할 수 있어 bone bank 냉동고에 개별 보관중입니다. / 병원 내 보관은 언제까지 하여야 하는지? / 환자가 타 병원으로 이송할 경우 bone을 전달해도되는지? / 환자가 bone을 병원에 두고 사망한 경우 어떻게 처리하여야 하는지?", "a": "질의 1, 2에 대하여\n - 「폐기물관리법 시행규칙」 별표5 제5호나목3)에서는 의료행위가 끝났을 때 발생하는 폐기물을 의료폐기물로 보고 있습니다. 향후 사용할 여지가 있어 병원 내 보관하는 경우 의료행위 과정으로 볼 수 있습니다. 따라서 환자에게 다시 사용하기 위해 보관하는 경우 의료폐기물로 보기 어려울 것으로 판단됩니다.\nA) 질의 3에 대하여\n - 더 이상 의료행위에 사용되지 않는다면, 의료행위가 종료된 시점(환자가 퇴원하거나 사망한 시점)부터 의료폐기물 중 조직물류폐기물로 보는 것이 바람직 할 것입니다. 다만, 「폐기물관리법 시행규칙」 별표5 제5호가목1)에 따라 본인이 요구할 경우 공설묘지에 묻거나 화장하는 경우에 한해 인도하여 처리할 수 있습니다. 이 경우 인도한 자는 이를 상세히 기록하여 3년간 보존하여야 합니다."}, {"id": "➁-26", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "환자의 발치된 치아를 가공처리하여 자가치아뼈이식재를 제조하고 있습니다. 환자의 동의를 얻어 가공한 후 환자 자신에게 다시 사용되도록 하고 있습니다. 이 경우 환자 자신에게 사용되는 치아가 의료폐기물에 해당하는지?", "a": "환자가 본인 치아를 뼈이식재로 사용하기 위해 발치하는 경우, 의료행위 과정으로 볼 수 있어 해당 치아는 의료폐기물에 해당하지 않을 것으로 사료됩니다."}, {"id": "➁-27", "cat": "해당여부·분류", "catFull": "② 의료폐기물 해당 여부 및 분류", "intro": "◇ 의료폐기물과 접촉하였다면 의료폐기물에 해당\n\n ◇ 의료폐기물과 접촉하지 않고, 의료행위와 관련 없다면 非의료폐기물", "q": "생물화학폐기물 중 폐화학치료제의 범위는?", "a": "폐화학치료제란 비(非)세포독성 화학요법제(항균, 항바이러스, 항원충제(기생충)등)로서, 암 치료에 쓰이는 세포독성 항암제를 제외한 감염병 치료 및 기타 화학요법에 사용 후 폐기되는 의약품을 의미합니다. 대표성분의 예로는 항병원생물성 의약품(항생제) 전체, 화학요법제(외용항생제 및 항바이러스제 등 포함)가 해당됩니다."}, {"id": "③-1", "cat": "격리의료폐기물", "catFull": "③ 격리의료폐기물 관련", "intro": "◇ 감염병 격리 환자에 대한 의료행위에서 발생한 폐기물만 해당\n\n ◇ 다만, 그 외 행위에서 발생한 폐기물도 감염관리는 필요", "q": "HIV감염자의 체액이나 혈액이 묻은 거즈 등은 격리의료폐기물에 해당하는지?", "a": "격리의료폐기물은 「감염병예방법」 제2조제1호의 감염병으로부터 타인을 보호하기 위하여 격리된 사람에 대한 의료행위에서 발생한 일체의 폐기물을 말합니다.\n - 따라서, 격리되지 않은 일반 HIV 감염자의 의료행위에서 발생한 폐기물은 격리의료폐기물에 해당하지 않습니다."}, {"id": "③-2", "cat": "격리의료폐기물", "catFull": "③ 격리의료폐기물 관련", "intro": "◇ 감염병 격리 환자에 대한 의료행위에서 발생한 폐기물만 해당\n\n ◇ 다만, 그 외 행위에서 발생한 폐기물도 감염관리는 필요", "q": "격리환자가 남긴 잔반 및 식기도 격리의료폐기물로 처리해야 하는지? / 감염병 환자에게서 나온 일회용품(식기류 등)은 감염성폐기물로 분류하는지? / 격리병동에서 격리환자 보호자가 사용한 물품을 퇴원시 모두 버리고 가는데, 보호자가 사용하였던 물건들을 격리의료폐기물로 처리해야 하는지 아니면 생활폐기물로 처리하여도 되는지? / 격리 환자 소변을 받았던 소변기 및 췌변기(대변기)는 어떻게 처리하여야하는지? / 격리병실 의료진이나 병실 출입자가 입는 1회용 가운 등이 환자의 체액이나 분비물이 묻은 경우에도 격리의료 폐기물로 처리하고 있음. 그런데 출입자가 입은 1회용 가운 등이 오염되지 않고 폐기하는 경우 폐기물은 무엇으로 처리해야 하는지?", "a": "격리의료폐기물은 감염병으로부터 타인을 보호하기 위하여 격리된 사람에 대한 의료행위에서 발생한 일체의 폐기물로서, 의료행위와 직접적인 관련이 없이 생활 과정에서 발생하는 격리환자가 사용한 식기와 잔반 등은 의료폐기물에 해당하지 않습니다.\n - 다만, ‘감염병 환자가 격리된 장소에서 나온 폐기물’은 감염병별 특성에 따라 감염을 유발할 수 있는 병원균을 포함할 수 있으며, 세계보건기구(WHO*)는 △격리 병동(isolation wards)에서 감염된 환자로부터 나온 폐기물, △혈액이나 다른 체액으로 오염된 폐기물을 ‘감염성 폐기물(infectious waste**)’로 분류함\n   * 「Safe management of wastes from health-care activities」, 2014, WHO\n  ** 혈액이나 체액을 포함하지 않은 비감염성 환자에게서 나온 폐기물의 경우, ‘비위험성 폐기물(Non-Hazardous waste)’로 분류\n - 따라서, 격리실에서 배출된 폐기물의 분류에 대해서는 감염병의 종류별 특성 및 전파경로, 위험도 등을 종합 검토하여 판단하여야 함\n   ※ 미국 일부 주의 경우, 에볼라, 라사열, 황열, 콜레라, 결핵, 천연두, 사스 등에 한하여 별도로 격리폐기물(isolation waste)로 정의·분류\n※ 감염병: 제1급감염병, 제2급감염병, 제3급감염병, 제4급감염병, 기생충감염병, 세계보건기구 감시대상 감염병, 생물테러감염병, 성매개감염병, 인수공통감염병 및 의료관련감염병 포함(질병관리청 고시 참고)\n※ 의료행위: 의학 전문지식을 기초로 하는 경험과 기능으로 진찰, 검안, 처방, 투약, 외과적 시술을 시행해야 하는 질병 예방, 치료행위 및 그 밖에 의료인이 행하지 아니하면 보건위생상 위해가 생길 우려가 있는 행위"}, {"id": "③-3", "cat": "격리의료폐기물", "catFull": "③ 격리의료폐기물 관련", "intro": "◇ 감염병 격리 환자에 대한 의료행위에서 발생한 폐기물만 해당\n\n ◇ 다만, 그 외 행위에서 발생한 폐기물도 감염관리는 필요", "q": "격리병실 의료폐기물 처리방법 문의 1. 감염성 환자를 수용하는 격리병실에 의료폐기물 전용용기(적색합성수지)와 일반 생활쓰레기용 휴지통을 같이 비치하여 분리배출 해도 되는지? 2. 감염성 환자를 수용하는 격리병실에 환자 외 보호자가 사용했던 마스크, 가운 등은 의료폐기물에 해당하는지? 3. 감염성 환자를 수용하는 격리병실 내에서 환자가 사용한 커피믹스, 종이컵, 햇반, 음료캔 등을 의료폐기물로 처리해야 하는것인지? 4. 감염성 환자를 수용하는 격리병실 내에서 보호자가 사용한 커피믹스, 종이컵, 햇반, 음료캔 등을 의료폐기물로 처리하여야 하는 것인지? 5. 격리병동 내 전실에 있는 간호 스테이션에서 간호사들이 사용한 폐종이, 물품 박스는 생활폐기물로 처리해야 하는지, 의료폐기물로 처리해야 하는지?", "a": "질의 1에 대하여\n - 「폐기물관리법」 상 격리병실 내 의료폐기물 전용용기와 생활 쓰레기용 휴지통에 대한 비치 방법에 대하여는 구체적으로 규정하고 있지 않습니다.\nA) 질의 2,3,4에 대하여\n - 격리의료폐기물은 감염병으로부터 타인을 보호하기 위하여 격리된 사람에 대한 의료행위에서 발생한 일체의 폐기물을 말합니다.\n - 따라서, 의료행위와 직접적인 관련이 없이 사용한 물품은 격리의료폐기물에는 해당하지 않습니다.\n - 다만, 「폐기물관리법」에 규정되어 있지는 않지만, 안전관리를 위해 격리병실에서 발생하였으나, 격리의료폐기물이 아닌 폐기물(사업장생활계폐기물 또는 생활폐기물)에 대하여는 「감염병의 예방 및 관리에 관한 법률 시행규칙」에 따라 소독하여 배출하는 것이 바람직할 것으로 사료됩니다.\nA) 질의 5에 대하여\n - 의료행위와 직접적인 관련이 없는 물품은 격리의료폐기물에 해당하지 않습니다."}, {"id": "④-1", "cat": "소독·세척·세탁", "catFull": "④ 소독, 세척, 세탁 관련", "intro": "◇ 환자의 혈액, 체액, 분비물 등이 포함되면 의료폐기물", "q": "환자가 의료행위로 침상에 잠시 눕고 난 후 다음 환자가 그 침상을 사용하기 전에 소독티슈로 닦는 경우, 이 때 사용한 소독 티슈는 의료폐기물인지?", "a": "침상에 환자의 혈액, 체액, 분비물, 배설물이 묻어 있어 이를 닦아낸 경우라면 의료폐기물에 해당합니다."}, {"id": "④-2", "cat": "소독·세척·세탁", "catFull": "④ 소독, 세척, 세탁 관련", "intro": "◇ 환자의 혈액, 체액, 분비물 등이 포함되면 의료폐기물", "q": "환자 몸에 바른 초음파젤을 닦은 티슈는 일반의료폐기물인지?", "a": "초음파젤 및 티슈에 환자의 혈액․채액․분비물․배설물이 함유되어 있거나, 의료폐기물과 혼합․접촉된 경우에만 의료폐기물에 해당합니다."}, {"id": "④-3", "cat": "소독·세척·세탁", "catFull": "④ 소독, 세척, 세탁 관련", "intro": "◇ 환자의 혈액, 체액, 분비물 등이 포함되면 의료폐기물", "q": "보관장소는 주1회 소독을 해야 하는데 소독기준은 어떻게 되는지? 의료폐기물 창고를 소독할때 같이 소독해도 되는지? 소독대장도 갖추어야 하는지?", "a": "약물소독의 방법으로 주1회 소독을 하도록 규정하고 있으며, 소독대장과 관련한 규정을 두고 있지 않습니다."}, {"id": "④-4", "cat": "소독·세척·세탁", "catFull": "④ 소독, 세척, 세탁 관련", "intro": "◇ 환자의 혈액, 체액, 분비물 등이 포함되면 의료폐기물", "q": "소독에 사용가능한 약물 종류는? 락스를 희석해서 사용가능한지?", "a": "「폐기물관리법 시행규칙」 별표5에서 정하고 있는 소독방법은 「감염병의 예방 및 관리에 관한 법률 시행규칙」 별표6 제2호라목에 약물소독의 방법을 따르고 있으며, 소독약품의 종류는 「생활화학제품 및 살생물제의 안전관리에 관한 법률」에 따라 환경부장관의 승인을 받은 제품을 사용하시기 바랍니다(생활환경안전정보시스템-초록누리 참고). 그 이외 약품의 소독능력 및 사용여부 가능성은 질병관리청에 문의하시기 바랍니다."}, {"id": "④-5", "cat": "소독·세척·세탁", "catFull": "④ 소독, 세척, 세탁 관련", "intro": "◇ 환자의 혈액, 체액, 분비물 등이 포함되면 의료폐기물", "q": "소독 등을 위한 과산화수소액 등도 의료폐기물인가?", "a": "과산화수소, 메틸알코올 등은 폐기물관리법상 의료폐기물이 아닌 지정폐기물(유독물질 등)에 해당하며, 이를 적정하게 처리할 수 있는 처리업자에게 위탁처리하여야 합니다.\n   * 혈액 등 의료폐기물과 접촉하여 오염된 경우 의료폐기물 분류"}, {"id": "④-6", "cat": "소독·세척·세탁", "catFull": "④ 소독, 세척, 세탁 관련", "intro": "◇ 환자의 혈액, 체액, 분비물 등이 포함되면 의료폐기물", "q": "다회용 의료기기를 사용한 후 세척하고 남은 솜, 세척액 등은 의료폐기물인지?", "a": "환자의 혈액, 체액, 분비물, 배설물 등이 묻은 경우 의료폐기물로 분류하며, 그렇지 않은 경우에는 사업장일반폐기물에 해당합니다."}, {"id": "④-7", "cat": "소독·세척·세탁", "catFull": "④ 소독, 세척, 세탁 관련", "intro": "◇ 환자의 혈액, 체액, 분비물 등이 포함되면 의료폐기물", "q": "내시경, 석션 등을 통해 흡입한 액상의 분비물은 어떻게 처리해야 하는지?", "a": "석션 등을 통해 배출되는 분비물은 일반의료폐기물(액상)에 해당하나, 분비물에 혈액이 섞여 있는 경우는 조직물류 폐기물(액상)에 해당합니다.\n  - 다만, 치과 등에서 다량의 물과 세척하는 과정의 폐기물은 의료폐기물에 해당하지 않습니다."}, {"id": "④-8", "cat": "소독·세척·세탁", "catFull": "④ 소독, 세척, 세탁 관련", "intro": "◇ 환자의 혈액, 체액, 분비물 등이 포함되면 의료폐기물", "q": 생활계폐기물(폐의약품)으로 분류될 수 있습니다."}, {"id": "⑤-4", "cat": "폐의약품", "catFull": "⑤ 폐의약품 관련", "intro": "◇ 백신접종 및 항암치료와 관련된 폐백신, 폐항암제, 폐화학치료제만 의료폐기물이며, 그 외는 폐의약품(사업장일반폐기물)\n\n ◇ 다만, 폐의약품에 혈액, 체액 등이 포함된 경우 의료폐기물", "q": "병원 병리과에서 조직검사를 한 후 포르말린 용기에 담긴 포르말린 용액 및 조직은 분리과정을 거친 후 따로 따로 폐기해야 하는 건가요? 아니면 같이 폐기해도 되는건가요?", "a": "의료폐기물과 혼합되거나 접촉된 폐기물은 혼합되거나 접촉된 의료폐기물과 같은 폐기물로 분류됩니다. 따라서, 조직물류와 혼합․접촉한 포르말린과 보관통은 조직물류 의료폐기물로 처리하여야 합니다.\n - 다만, 폭발·인화 가능성이 있는 물질의 경우 인계 시 관련 내용 사항을 명확히 전달하여야 합니다."}, {"id": "⑤-5", "cat": "폐의약품", "catFull": "⑤ 폐의약품 관련", "intro": "◇ 백신접종 및 항암치료와 관련된 폐백신, 폐항암제, 폐화학치료제만 의료폐기물이며, 그 외는 폐의약품(사업장일반폐기물)\n\n ◇ 다만, 폐의약품에 혈액, 체액 등이 포함된 경우 의료폐기물", "q": "사용하고 남은 마약류를 보관하고 있다가 일괄 의료폐기물로 처리, 폐기하라고 나와 있는데 의료폐기물로 분류할 경우 분류코드를 어떤 것으로 지정하면 되는지? 생물화학폐기물로 분류하면 되는지?", "a": "마약류가 폐백신, 폐항암제, 폐화학치료체인 경우 생물‧화학폐기물에 해당될 수 있으나, 그렇지 않은 경우에는 의료폐기물에 해당하지 않습니다.\n - 또한, 마약류는 ｢마약류 관리에 관한 법률｣에서 정하는 폐기에 관한 절차 및 방법을 준수하여야 하며 이에 대한 상세한 사항은 식품의약품안전처로 문의하시기 바랍니다."}, {"id": "⑤-6", "cat": "폐의약품", "catFull": "⑤ 폐의약품 관련", "intro": "◇ 백신접종 및 항암치료와 관련된 폐백신, 폐항암제, 폐화학치료제만 의료폐기물이며, 그 외는 폐의약품(사업장일반폐기물)\n\n ◇ 다만, 폐의약품에 혈액, 체액 등이 포함된 경우 의료폐기물", "q": "환자에게 사용한 혈액 등과 접촉되지 않는 수액병, 앰플병, 바이알병은 의료폐기물에 해당되는지? 생활폐기물(재활용 폐기물)로 처리해도 되는지? / 수액병이나 수액백을 폐기할 때 의료폐기물인지? 그리고 항생제, 항암제 등이 아닌 단순 비타민을 믹스한 수액백은 의료폐기물인지? 아미노산 제제 수액병은 어떻게 폐기해야 하는지?", "a": "「폐기물관리법 시행령」별표2(의료폐기물의 종류)에 따라 폐백신, 폐항암제, 폐화학치료제와 혼합·접촉되지 않고, 혈액 등이 함유되어있지 않은 경우에는 의료폐기물에 해당하지 않습니다(깨졌다 하더라도 의료폐기물에 해당하지 않음).\n - 의료폐기물이 아닌 경우 사업장폐기물(일반, 생활계)에 해당되며, 사업장폐기물 중「폐기물관리법 시행령」 별표1(지정폐기물의 종류)에 해당하는 경우 지정폐기물이므로 폐기물의 성상에 대해서도 검토하여야 합니다. 자세한 폐기물의 분류는 「폐기물관리법 시행규칙」별표4의 폐기물의 종류별 세부분류를 참고하시기 바랍니다.\n - 질의하신 수액병 또는 수액백이 의료폐기물 또는 지정폐기물의 종류에 해당되지 않는다면 사업장폐기물로 처리하여야 할 것으로 사료됩니다. 다만, 사업장생활계폐기물로서 생활폐기물과 성질과 상태가 비슷하여 생활폐기물의 기준 및 방법으로 처리할 수 있는 폐기물은 지자체 조례가 정하는 바에 따라 생활폐기물 기준 및 방법으로 처리할 수 있으니, 동 사항에 관하여는 관할 지자체에 문의하시기 바랍니다."}, {"id": "⑤-7", "cat": "폐의약품", "catFull": "⑤ 폐의약품 관련", "intro": "◇ 백신접종 및 항암치료와 관련된 폐백신, 폐항암제, 폐화학치료제만 의료폐기물이며, 그 외는 폐의약품(사업장일반폐기물)\n\n ◇ 다만, 폐의약품에 혈액, 체액 등이 포함된 경우 의료폐기물", "q": "의약품 포장 용기도 일반폐기물로 분류하라고 되어있던데 환자에게 드레싱을 하기 위해 일회용 드레싱 세트에 포타딘, 알코올 등을 담고 환자에게 드레싱을 실시했을 경우 사용한 포타딘 솜이나 알코올 솜은 의료폐기물로 버리고 직접 접촉하지 않은 용기는 포타딘이 묻어있고 알코올이 묻어있어도 일반 폐기물에 버리면 되는건지?", "a": "“폐백신, 폐항암제, 폐화학치료제” 이외의 폐의약품은 의료폐기물에 해당하지 않으며, 해당 용기에 의약품이 남아 있는 경우라면 발생량, 배출시설 유무 등에 따라 사업장일반폐기물(“폐의약품”) 또는 생활폐기물로 분류될 수 있습니다."}, {"id": "⑤-8", "cat": "폐의약품", "catFull": "⑤ 폐의약품 관련", "intro": "◇ 백신접종 및 항암치료와 관련된 폐백신, 폐항암제, 폐화학치료제만 의료폐기물이며, 그 외는 폐의약품(사업장일반폐기물)\n\n ◇ 다만, 폐의약품에 혈액, 체액 등이 포함된 경우 의료폐기물", "q": "\"혈액오염폐기물\"인지 아니면 \"조직물류 폐기물\"인지 판단 여부 환자에게 수혈을 한 후 수혈팩에 소량 혈액이 남아 있는 상태입니다. 수액세트 아래 호스를 가위로 자르면 남아 있는 혈액이 흐를 정도입니다. 인공신장실에서 혈액투석을 한 후 액체가 가득 담긴 '혈액투석 필터 및 라인'을 폐기하는 건입니다. 여기에는 \"정수물, 중탄산나트륨, 혈액\" 이 혼합되어 있습니다. / 혈액투석에 사용한 후 남은(환자에게 주입되지 않은 잔여분) 중탄산나트륨(NaHCO3) 의 경우 의료폐기물에 해당되는지, 아니면 잔여 용액은 생활하수로 버리고, 팩은 일반생활폐기물로도 처리 가능한지?", "a": "「폐기물관리법 시행령」별표2에 따라 혈액, 고름 및 혈액생성물 등은 ‘조직물류폐기물’이며, 폐혈액백, 혈액투석 시 사용된 폐기물과 함께 혈액이 포함되어 있는 폐기물은 ‘혈액오염폐기물’에 해당합니다. 다만, 혈액이 포함되지 않은 사용하고 난 중탄산나트륨 등은 의료폐기물에 해당하지 않으며, 구체적인 처리 방법은 지자체에 문의하시기 바랍니다."}, {"id": "⑤-9", "cat": "폐의약품", "catFull": "⑤ 폐의약품 관련", "intro": "◇ 백신접종 및 항암치료와 관련된 폐백신, 폐항암제, 폐화학치료제만 의료폐기물이며, 그 외는 폐의약품(사업장일반폐기물)\n\n ◇ 다만, 폐의약품에 혈액, 체액 등이 포함된 경우 의료폐기물", "q": "리도카인 앰플(파손된 것, 파손되지 않은 것)은 손상성 폐기물로 처리해야하는지? 화학폐기물로 처리해야하는지?", "a": "폐항암제, 폐백신, 폐화학치료제를 담고 있거나 이와 혼합․접촉한 앰플병은 의료폐기물 중 생물화학폐기물로 분류되며 폐백신, 폐항암제, 폐화학치료제가 아닌 경우에는 의료폐기물에 해당하지 않으며 파손되었더라도 의료폐기물에 해당하지 않습니다."}, {"id": "⑤-10", "cat": "폐의약품", "catFull": "⑤ 폐의약품 관련", "intro": "◇ 백신접종 및 항암치료와 관련된 폐백신, 폐항암제, 폐화학치료제만 의료폐기물이며, 그 외는 폐의약품(사업장일반폐기물)\n\n ◇ 다만, 폐의약품에 혈액, 체액 등이 포함된 경우 의료폐기물", "q": "정형외과 물리치료실에서 주사기를 간섭파 치료기의 도자컵 스펀지에 약물(리도카인 등)을 넣는 용도로 사용 후 의료폐기물 전용용기에 버린 경우 이때 주사기는 의료폐기물에 해당하는지?", "a": "주사기가 혈액·체액·분비물·배설물을 함유되어 있지 않은 일회용 주사기(주사바늘 제외)로 폐백신·폐항암제·폐화학치료제 등 의료폐기물과 혼합·접촉하지 않은 경우 의료폐기물에 해당하지 않습니다.\n - 다만, 의료폐기물이 아닌 주사기를 의료폐기물 전용용기에 투입하여 의료폐기물과 혼합·접촉된 경우에는 의료폐기물로 분류됩니다."}, {"id": "⑤-11", "cat": "폐의약품", "catFull": "⑤ 폐의약품 관련", "intro": "◇ 백신접종 및 항암치료와 관련된 폐백신, 폐항암제, 폐화학치료제만 의료폐기물이며, 그 외는 폐의약품(사업장일반폐기물)\n\n ◇ 다만, 폐의약품에 혈액, 체액 등이 포함된 경우 의료폐기물", "q": "병원 약제팀에서 시럽종류의 의약품을 조제하여 환자에게 분출하고 있습니다. 해당 의약품의 내용물을 다 사용하고 버릴 때에 용기를 어떻게 버려야 하는지? 환자의 체액, 혈액 등은 전혀 묻지 않았으며, 환자가 없는 약제팀 조제구역에서 사용됩니다.", "a": "질의하신 의약품 용기에「폐기물관리법 시행령」별표2 제2호라목에 따른 폐백신, 폐항암제, 폐화학치료제가 담겨져 있었다면 폐의약품이 의료폐기물(생물·화학폐기물)에 해당되며, 동 의료폐기물과 혼합·접촉한 용기도 의료폐기물로 처리하여야 합니다.\n - 만약, 질의하신 품목이 「폐기물관리법 시행령」별표2에 따른 의료폐기물에 해당되지 않은 경우, 배출시설 설치유무에 따라 사업장배출시설계폐기물 또는 사업장생활계폐기물로 분류될 수 있으며,「폐기물관리법」제18조에 따라 사업장폐기물로 처리하여야 합니다. 다만, 사업장생활계폐기물로서 생활폐기물과 성질과 상태가 비슷하여 생활폐기물의 기준 및 방법으로 처리할 수 있는 폐기물은 지자체 조례가 정하는 바에 따라 생활폐기물 기준 및 방법으로 처리할 수 있으니, 동 사항에 관하여는 관할 지자체에 문의하시기 바랍니다."}, {"id": "⑤-12", "cat": "폐의약품", "catFull": "⑤ 폐의약품 관련", "intro": "◇ 백신접종 및 항암치료와 관련된 폐백신, 폐항암제, 폐화학치료제만 의료폐기물이며, 그 외는 폐의약품(사업장일반폐기물)\n\n ◇ 다만, 폐의약품에 혈액, 체액 등이 포함된 경우 의료폐기물", "q": "병원 임상병리실에서 사용한 시약을 폐기처분할 때 폐기물로 처리해야하는지 기타수질오염원으로 신고하고 처리하여야 하는지?", "a": "「폐기물관리법 시행령」 별표2에 따라 폐시약에 혈액 등 의료폐기물이 혼합되어 배출되는 경우와 시약이 백신, 항암제, 화학치료제 성분을 담고 있다면 의료폐기물로, 그렇지 않은 경우 폐시약 종류에 따라 「폐기물관리법 시행령」 별표1의 지정폐기물 또는 사업장일반폐기물에 분류될 수 있으니 해당 폐기물의 처리방법에 맞게 처리하시기 바랍니다.\n - 다만, 「폐기물관리법 시행규칙」 제10조에 따라 액상의 폐기물을 「물환경보전법」제2조제12호에 따른 수질오염방지시설에 직접 유입하여 처리하는 경우로서, 그 배출시설의 설치허가권자가 인정하는 경우 예외가 인정되오니, 구체적인 사항은 관할 지자체에 문의하시기 바랍니다."}, {"id": "⑥-1", "cat": "배출·보관·운반", "catFull": "⑥ 의료폐기물 배출, 보관, 수집·운반 관련", "intro": "◇ 의료폐기물의 배출, 보관, 수집·운반관련 규정 전문은 「폐기물관리법 시행규칙」 별표5에서 확인 가능\n\n ※ 참고) 의료폐기물 전용용기의 구조·규격·품질·표시 및 검사방법에 관한 고시 \n\n             의료기관 일회용기저귀 전용봉투의 구조·규격·품질·표시에 관한 고시", "q": "의료폐기물인 태반, 치아를 본인이 원하는 경우 인도 가능한지?", "a": "의료폐기물 중 인체조직물은 본인이 요구하면 본인에게 인도하여 공설묘지에 묻거나 화장시설에서 화장하여 처리할 수 있습니다. 이 경우, 의료폐기물을 인도한 자는 이를 상세히 기록하여 3년간 보존하여야합니다. 다만, 본인에게 인도되어 감염, 환경오염 등 부적정한 처리가 예상될 경우에는 인도하지 아니하여야 할 것입니다."}, {"id": "⑥-2", "cat": "배출·보관·운반", "catFull": "⑥ 의료폐기물 배출, 보관, 수집·운반 관련", "intro": "◇ 의료폐기물의 배출, 보관, 수집·운반관련 규정 전문은 「폐기물관리법 시행규칙」 별표5에서 확인 가능\n\n ※ 참고) 의료폐기물 전용용기의 구조·규격·품질·표시 및 검사방법에 관한 고시 \n\n             의료기관 일회용기저귀 전용봉투의 구조·규격·품질·표시에 관한 고시", "q": "봉투형 전용용기 거치대를 사용할 경우 재사용이 가능한지?", "a": "「폐기물관리법」에는 봉투형 전용용기 거치대에       <div class="qresult ${c.resultType}">→ ${c.result}</div>
    </div>
  `).join("");
  wrap.querySelectorAll(".qcard").forEach(el => {
    el.addEventListener("click", () => runSearch(el.dataset.q));
  });
}

// ---------- render: chapter accordion ----------
function renderChapterAcc(){
  const chapters = {};
  DATA.sections.forEach(s => {
    (chapters[s.chapter] = chapters[s.chapter] || []).push(s);
  });
  const wrap = document.getElementById("chapterAcc");
  wrap.innerHTML = Object.keys(chapters).map((ch,i) => `
    <div class="acc" id="chap-${i}">
      <div class="acc-head">
        <div class="left"><span class="dot" style="background:var(--brand-2)"></span><h3>${ch}</h3></div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="n">${chapters[ch].length}개 항목</span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="acc-body">
        ${chapters[ch].map(s => `
          <div class="sec-item">
            <span class="sec-title">${s.code} ${s.title}</span>${escapeHtml(s.body).replace(/\n/g,"<br>")}
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");
}

// ---------- render: qa accordion ----------
function renderQaAcc(){
  const byCat = {};
  DATA.flat_qas.forEach(x => { (byCat[x.cat] = byCat[x.cat] || []).push(x); });
  document.getElementById("qaTotalCount").textContent = `(총 ${DATA.flat_qas.length}건)`;
  const wrap = document.getElementById("qaAcc");
  wrap.innerHTML = Object.keys(byCat).map((cat,i) => {
    const col = CAT_COLOR[cat] || {c:"var(--brand-2)", t:"var(--brand-tint)"};
    return `
    <div class="acc" id="qacat-${i}">
      <div class="acc-head">
        <div class="left"><span class="dot" style="background:${col.c}"></span><h3>${cat}</h3></div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="n">${byCat[cat].length}건</span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="acc-body">
        ${byCat[cat].map((x,j) => `
          <div class="qa-item" id="qacat-${i}-${j}">
            <div class="qa-q">
              <span class="qmark">Q</span><span>${escapeHtml(x.q)}</span><svg class="qchev" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="qa-id">${x.id||""}</div>
            <div class="qa-a">${escapeHtml(x.a)}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `}).join("");
}

// event delegation: works even where inline onclick attributes might be restricted
document.getElementById("chapterAcc").addEventListener("click", (e)=>{
  const head = e.target.closest(".acc-head");
  if(head) head.parentElement.classList.toggle("open");
});
document.getElementById("qaAcc").addEventListener("click", (e)=>{
  const head = e.target.closest(".acc-head");
  if(head){ head.parentElement.classList.toggle("open"); return; }
  const q = e.target.closest(".qa-q");
  if(q) q.parentElement.classList.toggle("open");
});

// ---------- chips ----------
function renderChips(){
  document.getElementById("chipRow").innerHTML = CHIPS.map(c =>
    `<span class="chip" data-q="${escapeAttr(c)}">${c}</span>`
  ).join("");
  document.querySelectorAll(".chip").forEach(el=>{
    el.addEventListener("click", ()=> runSearch(el.dataset.q));
  });
}

// ---------- search ----------
const input = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearBtn");
const viewHome = document.getElementById("view-home");
const viewSearch = document.getElementById("view-search");

function runSearch(q){
  input.value = q;
  doSearch();
  input.scrollIntoView({behavior:"smooth", block:"start"});
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }
function highlight(text, terms){
  let out = escapeHtml(text);
  terms.forEach(t=>{
    if(!t) return;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
    out = out.replace(re, m => `<mark>${m}</mark>`);
  });
  return out;
}

function doSearch(){
  const raw = input.value.trim();
  clearBtn.classList.toggle("show", raw.length>0);
  if(!raw){
    viewHome.style.display = "";
    viewSearch.style.display = "none";
    return;
  }
  viewHome.style.display = "none";
  viewSearch.style.display = "block";

  const terms = raw.toLowerCase().split(/\s+/).filter(Boolean);
  const all = [...qaItems, ...sectionItems];
  const scored = [];
  all.forEach(item=>{
    let score = 0;
    let allMatch = true;
    terms.forEach(t=>{
      if(item.search.includes(t)){
        score += 1;
        if(item.type==="qa" && item.q.toLowerCase().includes(t)) score += 3;
        if(item.type==="section" && item.title.toLowerCase().includes(t)) score += 3;
      } else {
        allMatch = false;
      }
    });
    if(allMatch) scored.push({item, score});
  });
  scored.sort((a,b)=> b.score - a.score);

  if(scored.length===0){
    viewSearch.innerHTML = `
      <div class="empty">
        <div class="big">🔍</div>
        <p><strong>"${escapeHtml(raw)}"</strong>에 대한 결과가 없습니다.</p>
        <p>다른 단어로 검색하거나, 위 목차·질의회신 목록에서 직접 찾아보세요.</p>
      </div>`;
    return;
  }

  viewSearch.innerHTML = `<div class="section-title">검색결과 <span class="count">${scored.length}건</span></div>` +
    scored.map(({item}, idx)=>{
      if(item.type==="qa"){
        const col = CAT_COLOR[item.cat] || {c:"var(--brand-2)", t:"var(--brand-tint)"};
        return `
        <div class="result">
          <div class="rmeta">
            <span class="tag" style="color:${col.c};background:${col.t}">${item.cat}</span>
            ${item.id?`<span class="qa-id" style="margin:0;">${item.id}</span>`:""}
          </div>
          <div class="rq">${highlight(item.q, terms)}</div>
          <div class="ra collapsed">${highlight(item.a, terms)}</div>
          <div class="more-link"><span>더 보기</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </div>`;
      } else {
        return `
        <div class="result">
          <div class="rmeta">
            <span class="tag" style="color:var(--brand-2);background:var(--brand-tint)">${item.chapter}</span>
            <span class="qa-id" style="margin:0;">${item.code}</span>
          </div>
          <div class="rq">${highlight(item.title, terms)}</div>
          <div class="ra collapsed">${highlight(item.body, terms)}</div>
          <div class="more-link"><span>더 보기</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </div>`;
      }
    }).join("");
  viewSearch.querySelectorAll(".result").forEach(res=>{
    const ra = res.querySelector(".ra");
    if(ra.clientHeight===0 || ra.scrollHeight > ra.clientHeight + 2){
      res.querySelector(".more-link").classList.add("show");
    }
  });
}

input.addEventListener("input", doSearch);
clearBtn.addEventListener("click", ()=>{ input.value=""; doSearch(); input.focus(); });
viewSearch.addEventListener("click", (e)=>{
  const t = e.target.closest(".rq, .more-link");
  if(!t) return;
  const res = t.closest(".result");
  const ra = res.querySelector(".ra");
  const ml = res.querySelector(".more-link");
  const collapsed = ra.classList.toggle("collapsed");
  ml.classList.add("show");
  ml.classList.toggle("expanded", !collapsed);
  ml.querySelector("span").textContent = collapsed ? "더 보기" : "접기";
});

document.getElementById("homeBtn").addEventListener("click", ()=>{
  input.value=""; doSearch();
  document.querySelectorAll(".acc.open, .qa-item.open").forEach(el=>el.classList.remove("open"));
  window.scrollTo({top:0, behavior:"smooth"});
});

// back to top
const backTop = document.getElementById("backTop");
window.addEventListener("scroll", ()=>{
  backTop.classList.toggle("show", window.scrollY > 500);
});
backTop.addEventListener("click", ()=> window.scrollTo({top:0, behavior:"smooth"}));

renderQuickCards();
renderChapterAcc();
renderQaAcc();
renderChips();
</script>
</body>
</html>
