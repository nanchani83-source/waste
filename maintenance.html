<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>서비스 점검 안내 · KNUHUB</title>
<style>
  :root{
    --ink:#fff; --soft:rgba(255,255,255,.82); --accent:#ffe9a8; --orange:#ffa94d;
    --glass:rgba(255,255,255,.16); --glass-line:rgba(255,255,255,.35);
  }
  *{box-sizing:border-box;margin:0}
  body{
    min-height:100vh; display:grid; place-items:center; padding:32px 16px;
    color:var(--ink); overflow-x:hidden;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(60% 50% at 15% 10%, #8fe3cf 0%, transparent 70%),
      radial-gradient(70% 60% at 90% 95%, #3d82d6 0%, transparent 70%),
      linear-gradient(160deg,#6fd0cf 0%,#4aa3d8 55%,#3b7fd0 100%);
  }
  /* soft decorative blobs */
  body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(2px);z-index:0}
  body::before{width:360px;height:360px;right:-120px;top:-120px;background:rgba(61,130,214,.55)}
  body::after{width:300px;height:300px;left:-110px;bottom:-110px;background:rgba(143,227,207,.55)}

  main{position:relative;z-index:1;width:100%;max-width:520px;text-align:center}

  .badge{
    position:relative; width:220px; height:220px; margin:0 auto 28px;
    display:grid; place-items:center;
  }
  .badge::before{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,0) 70%);
  }
  .gear{width:170px;height:170px;animation:spin 18s linear infinite;filter:drop-shadow(0 10px 18px rgba(20,60,120,.35))}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tools{position:absolute;width:104px;height:104px;filter:drop-shadow(0 4px 6px rgba(20,60,120,.3))}
  .hourglass{
    position:absolute; left:-4px; top:-6px; width:56px; height:64px;
    filter:drop-shadow(0 6px 10px rgba(20,60,120,.3));
  }
  .hourglass .flip{transform-origin:50% 50%;animation:flip 6s ease-in-out infinite}
  @keyframes flip{0%,80%{transform:rotate(0)}100%{transform:rotate(180deg)}}

  .bar{
    width:min(300px,80%); height:16px; margin:0 auto 30px; border-radius:99px; padding:3px;
    background:var(--glass); border:1px solid var(--glass-line); backdrop-filter:blur(6px);
  }
  .bar span{
    display:block; height:100%; width:62%; border-radius:99px;
    background:linear-gradient(90deg,var(--orange),#ffd27a);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{50%{width:72%}}

  h1{font-size:clamp(36px,9vw,52px); font-weight:800; letter-spacing:-.03em; line-height:1.15;
     text-shadow:0 4px 18px rgba(20,60,120,.28)}
  h1 em{font-style:normal;color:var(--accent)}
  .lead{margin-top:18px;font-size:17px;line-height:1.75;color:var(--soft)}

  .time{
    display:inline-flex; align-items:center; gap:12px; margin-top:34px; padding:14px 22px;
    border-radius:16px; background:var(--glass); border:1px solid var(--glass-line);
    backdrop-filter:blur(8px); text-align:left;
  }
  .time small{display:block;font-size:12px;color:var(--soft);margin-bottom:2px}
  .time b{display:block;font-size:17px;font-weight:700}
  .time b.t{margin-top:2px;color:var(--accent)}
  .time svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;flex:none}

  .contact{margin-top:18px;font-size:14px;color:var(--soft)}
  footer{margin-top:32px;font-size:12px;color:rgba(255,255,255,.7)}
  @media (prefers-reduced-motion:reduce){.gear,.bar span,.hourglass .flip{animation:none}}
</style>
</head>
<body>
<main>
  <div class="badge" aria-hidden="true">
    <svg class="hourglass" viewBox="0 0 56 64">
      <g class="flip">
        <path d="M14 12h28v8c0 8-8 11-8 12s8 4 8 12v8H14v-8c0-8 8-11 8-12s-8-4-8-12z" fill="#f4f8ff" stroke="#3f88d8" stroke-width="3" stroke-linejoin="round"/>
        <path d="M19 15h18v5c0 5-9 9-9 12 0-3-9-7-9-12z" fill="#ffa94d"/>
        <path d="M22 50c3-5 9-5 12 0v1H22z" fill="#ffa94d"/>
        <rect x="9" y="6" width="38" height="6" rx="3" fill="#3f88d8"/>
        <rect x="9" y="52" width="38" height="6" rx="3" fill="#3f88d8"/>
      </g>
    </svg>

    <svg class="gear" viewBox="0 0 200 200">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6db4ec"/><stop offset="1" stop-color="#2f6cc4"/>
        </linearGradient>
      </defs>
      <g fill="url(#g)" stroke="#1f4f9c" stroke-width="5" stroke-linejoin="round">
        <circle cx="100" cy="100" r="76"/>
        <g id="t"><rect x="82" y="8" width="36" height="34" rx="6"/></g>
        <use href="#t" transform="rotate(45 100 100)"/><use href="#t" transform="rotate(90 100 100)"/>
        <use href="#t" transform="rotate(135 100 100)"/><use href="#t" transform="rotate(180 100 100)"/>
        <use href="#t" transform="rotate(225 100 100)"/><use href="#t" transform="rotate(270 100 100)"/>
        <use href="#t" transform="rotate(315 100 100)"/>
      </g>
      <circle cx="100" cy="100" r="48" fill="#ffa94d" stroke="#e07a1f" stroke-width="4"/>
      <circle cx="100" cy="100" r="36" fill="#bfe6f5" stroke="#1f4f9c" stroke-width="3"/>
    </svg>

    <svg class="tools" viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- spanner -->
      <path d="M32 68 L62 38" stroke="#1f4f9c" stroke-width="15"/>
      <path d="M32 68 L62 38" stroke="#eaf4fc" stroke-width="9"/>
      <circle cx="28" cy="72" r="6" fill="#eaf4fc" stroke="#1f4f9c" stroke-width="3"/>
      <circle cx="68" cy="32" r="17" fill="#eaf4fc" stroke="#1f4f9c" stroke-width="4"/>
      <rect x="61" y="9" width="14" height="22" fill="#bfe6f5" transform="rotate(45 68 32)"/>
      <circle cx="28" cy="72" r="2.2" fill="#bfe6f5"/>
    </svg>
  </div>

  <div class="bar" role="img" aria-label="점검 진행 중"><span></span></div>

  <h1>시스템 <em>점검 중</em></h1>
  <p class="lead">더 안정적인 서비스를 위해<br>점검을 진행하고 있습니다.<br>잠시만 기다려 주세요.</p>

  <div class="time">
    <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
    <div><small>점검 일시</small><b>2026. 11. 19 (목)</b><b class="t">10:00 ~ 12:00</b></div>
  </div>

  <p class="contact">문의 2072</p>

  <footer>© KNUHUB</footer>
</main>
</body>
</html>
